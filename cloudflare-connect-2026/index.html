<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare Connect 2026 talk summaries</title>
<meta name="color-scheme" content="light dark">
<script>
(function () {
  try {
    var t = localStorage.getItem("cf-connect-2026-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  try {
    var l = localStorage.getItem("cf-connect-2026-lang");
    if (l === "en" || l === "ru") document.documentElement.lang = l;
  } catch (e) {}
})();
</script>
<style>
/* Cloudflare Connect 2026 summaries tree — self-contained, no external assets */
:root {
  --bg: #f3f0ea;
  --bg-elev: #fffcf7;
  --bg-header: rgba(255, 252, 247, 0.97);
  --bg-input: #fff;
  --bg-hover: rgba(28, 24, 18, 0.05);
  --bg-active: rgba(28, 24, 18, 0.08);
  --text: #1a1714;
  --text-muted: #5f5850;
  --border: #e4ddd2;
  --border-strong: #d4cbbd;
  --accent: #d96c16;
  --accent-text: #9a4a0a;
  --accent-soft: rgba(217, 108, 22, 0.12);
  --highlight: #ffe08a;
  --highlight-text: #1a1714;
  --shadow: 0 1px 2px rgba(40, 30, 10, 0.05), 0 10px 28px rgba(40, 30, 10, 0.07);
  --focus: #1d4ed8;
  --youtube: #c4312b;
  --radius: 12px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --content-max: 52rem;
  --header-pad: 0.85rem 1.25rem;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #13110f;
  --bg-elev: #1c1916;
  --bg-header: rgba(19, 17, 15, 0.97);
  --bg-input: #151310;
  --bg-hover: rgba(255, 246, 230, 0.06);
  --bg-active: rgba(255, 246, 230, 0.1);
  --text: #f3eee6;
  --text-muted: #b0a89e;
  --border: #3a342c;
  --border-strong: #4a433a;
  --accent: #f0a35e;
  --accent-text: #f0a35e;
  --accent-soft: rgba(240, 163, 94, 0.14);
  --highlight: #8a5a10;
  --highlight-text: #fff6e0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.3);
  --focus: #93c5fd;
  --youtube: #ff6b64;
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100%;
}

body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.skip {
  position: absolute;
  left: 0.75rem;
  top: -3rem;
  z-index: 20;
  background: var(--bg-elev);
  color: var(--text);
  padding: 0.4rem 0.7rem;
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.skip:focus { top: 0.75rem; }

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 72rem;
  margin: 0 auto;
  padding: var(--header-pad);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem 1rem;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  min-width: 11rem;
  flex: 0 1 auto;
}

.brand-title {
  font-weight: 650;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.brand-sub {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.controls {
  display: flex;
  flex-wrap: nowrap;
  align-items: flex-start;
  gap: 0.5rem;
  margin-left: auto;
}

.search-wrap {
  position: relative;
  flex: 1 1 16rem;
  min-width: 11rem;
  max-width: 22rem;
  display: flex;
  flex-direction: column;
}

.search-field { position: relative; width: 100%; }

.search-field svg {
  position: absolute;
  left: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1rem;
  height: 1rem;
  color: var(--text-muted);
  pointer-events: none;
}

#search {
  width: 100%;
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text);
  border-radius: 999px;
  padding: 0.45rem 2.15rem 0.45rem 2.15rem;
  font: inherit;
  font-size: 0.9rem;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

#search::-webkit-search-decoration,
#search::-webkit-search-cancel-button,
#search::-webkit-search-results-button,
#search::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
}

#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-clear {
  position: absolute;
  right: 0.3rem;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  color: var(--text-muted);
  width: 1.7rem;
  height: 1.7rem;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  line-height: 1;
}
.search-wrap.has-query .search-clear { display: flex; }
.search-clear:hover { background: var(--bg-hover); color: var(--text); }

.search-meta {
  font-size: 0.72rem;
  color: var(--text-muted);
  padding: 0.2rem 0.85rem 0;
  min-height: 0;
  display: none;
  line-height: 1.2;
}
.search-wrap.has-query .search-meta { display: block; }

.btn, .icon-btn {
  font: inherit;
  font-size: 0.8rem;
  font-weight: 550;
  color: var(--text);
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 0.4rem 0.8rem;
  cursor: pointer;
  line-height: 1.2;
  white-space: nowrap;
  height: 2.2rem;
}
.btn:hover, .icon-btn:hover { background: var(--bg-hover); }
.btn:focus-visible, .icon-btn:focus-visible, #search:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.icon-btn {
  width: 2.2rem;
  height: 2.2rem;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn svg { width: 1.15rem; height: 1.15rem; display: block; }

[data-theme="light"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }

.seg {
  display: inline-flex;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-elev);
}
.seg button {
  font: inherit;
  font-size: 0.75rem;
  font-weight: 650;
  letter-spacing: 0.04em;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
  min-width: 2.3rem;
}
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.seg button + button { border-left: 1px solid var(--border); }

/* Main tree */
.main {
  max-width: 72rem;
  margin: 0 auto;
  padding: 1.25rem 1.25rem 3.5rem;
}

.tree-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 0.6rem 0.4rem 0.9rem;
}

.tree {
  list-style: none;
  margin: 0;
  padding: 0;
}

.tree ul {
  list-style: none;
  margin: 0;
  padding: 0 0 0 0.15rem;
}

/* Smooth open/close */
.children {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.28s ease;
}
.node.open > .children {
  grid-template-rows: 1fr;
}
.children-inner {
  overflow: hidden;
  min-height: 0;
}

.node { margin: 0; }

.row {
  display: flex;
  align-items: flex-start;
  gap: 0.45rem;
  padding: 0.38rem 0.7rem;
  border-radius: 10px;
  cursor: default;
  position: relative;
}
.node.has-children > .row { cursor: pointer; }
.row:hover { background: var(--bg-hover); }
.node:focus { outline: none; }
.node:focus-visible > .row {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
  background: var(--bg-active);
}

.chevron {
  flex: 0 0 1.15rem;
  width: 1.15rem;
  height: 1.15rem;
  margin-top: 0.28rem;
  color: var(--text-muted);
  transition: transform 0.22s ease;
  transform: rotate(0deg);
}
.node.open > .row > .chevron { transform: rotate(90deg); }
.node.leaf > .row > .chevron { visibility: hidden; }

.row-body {
  flex: 1 1 auto;
  min-width: 0;
}

.row-title {
  display: block;
  max-width: var(--content-max);
  overflow-wrap: anywhere;
}

.node.root > .row .row-title {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.node.talk > .row .row-title {
  font-size: 1.02rem;
  font-weight: 650;
  letter-spacing: -0.015em;
  line-height: 1.35;
}
.node.section > .row .row-title {
  font-size: 0.95rem;
  font-weight: 650;
}
.node.intro > .row .row-title,
.node.item > .row .row-title {
  font-size: 0.925rem;
  font-weight: 400;
  line-height: 1.65;
  color: var(--text);
}

.speaker {
  display: block;
  color: var(--text-muted);
  font-size: 0.82rem;
  margin-top: 0.15rem;
  max-width: var(--content-max);
  line-height: 1.45;
}

.yt-link {
  flex: 0 0 auto;
  margin-left: 0.4rem;
  margin-top: 0.1rem;
  color: var(--youtube);
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  border: 1px solid color-mix(in srgb, var(--youtube) 35%, var(--border));
  border-radius: 999px;
  padding: 0.18rem 0.5rem;
  white-space: nowrap;
  align-self: flex-start;
}
.yt-link:hover { background: color-mix(in srgb, var(--youtube) 12%, transparent); }

.page-link {
  flex: 0 0 auto;
  margin-left: 0.4rem;
  margin-top: 0.1rem;
  color: var(--accent-text);
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  border-radius: 999px;
  padding: 0.18rem 0.5rem;
  white-space: nowrap;
  align-self: flex-start;
  background: var(--accent-soft);
}
.page-link:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }

/* Language visibility */
.lang-en, .lang-ru { display: contents; }
html[lang="en"] .lang-ru,
html[lang="ru"] .lang-en { display: none; }

/* When display:contents, children show; hidden lang wrappers must hide their text.
   display:contents on the visible one lets typography inherit from row-title.
   For the hidden one, display:none on the wrapper is enough if we do NOT use contents for hidden.
   The rules above hide the opposite language. */

mark {
  background: var(--highlight);
  color: var(--highlight-text);
  padding: 0 0.12em;
  border-radius: 2px;
  font: inherit;
}

code {
  font-family: var(--mono);
  font-size: 0.86em;
  background: var(--bg-hover);
  border-radius: 4px;
  padding: 0.07em 0.28em;
}

a:not(.yt-link) {
  color: var(--accent-text);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}
a:not(.yt-link):hover { text-decoration-thickness: 2px; }

/* Talk accents */
.node.talk { --talk: var(--accent); }
.node.talk > .row {
  border-left: 3px solid var(--talk);
  padding-left: calc(0.7rem - 3px);
  margin: 0.2rem 0.35rem 0.15rem;
  border-radius: 0 10px 10px 0;
}
.node.talk[data-accent="0"] { --talk: #f6821f; }
.node.talk[data-accent="1"] { --talk: #0284c7; }
.node.talk[data-accent="2"] { --talk: #0d9488; }
.node.talk[data-accent="3"] { --talk: #e11d48; }
.node.talk[data-accent="4"] { --talk: #2563eb; }
.node.talk[data-accent="5"] { --talk: #7c3aed; }
.node.talk[data-accent="6"] { --talk: #db2777; }
.node.talk[data-accent="7"] { --talk: #d97706; }
.node.talk[data-accent="8"] { --talk: #ea580c; }
.node.talk[data-accent="9"] { --talk: #16a34a; }
.node.talk[data-accent="10"] { --talk: #4f46e5; }
.node.talk[data-accent="11"] { --talk: #0891b2; }
.node.talk[data-accent="12"] { --talk: #ca8a04; }

[data-theme="dark"] .node.talk[data-accent="0"] { --talk: #fb923c; }
[data-theme="dark"] .node.talk[data-accent="1"] { --talk: #38bdf8; }
[data-theme="dark"] .node.talk[data-accent="2"] { --talk: #2dd4bf; }
[data-theme="dark"] .node.talk[data-accent="3"] { --talk: #fb7185; }
[data-theme="dark"] .node.talk[data-accent="4"] { --talk: #60a5fa; }
[data-theme="dark"] .node.talk[data-accent="5"] { --talk: #a78bfa; }
[data-theme="dark"] .node.talk[data-accent="6"] { --talk: #f472b6; }
[data-theme="dark"] .node.talk[data-accent="7"] { --talk: #fbbf24; }
[data-theme="dark"] .node.talk[data-accent="8"] { --talk: #fb923c; }
[data-theme="dark"] .node.talk[data-accent="9"] { --talk: #4ade80; }
[data-theme="dark"] .node.talk[data-accent="10"] { --talk: #818cf8; }
[data-theme="dark"] .node.talk[data-accent="11"] { --talk: #22d3ee; }
[data-theme="dark"] .node.talk[data-accent="12"] { --talk: #facc15; }

/* Nested indent + guide line */
.tree > .node > .children > .children-inner > ul > .node > .children > .children-inner > ul {
  margin-left: 1.35rem;
  padding-left: 0.7rem;
  border-left: 1px solid var(--border);
}

.item-num {
  font-weight: 700;
  color: var(--text-muted);
  margin-right: 0.35rem;
  font-variant-numeric: tabular-nums;
}

.hidden-branch { display: none !important; }

.no-results {
  display: none;
  padding: 1.5rem 1rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.95rem;
}
.tree.empty + .no-results { display: block; }

@media (max-width: 720px) {
  .header-inner { padding: 0.75rem 0.85rem; }
  .main { padding: 0.85rem 0.7rem 2.5rem; }
  .search-wrap { max-width: none; flex-basis: 100%; }
  .controls { margin-left: 0; width: 100%; flex-wrap: wrap; align-items: center; }
  .brand { flex-basis: auto; }
  .yt-link { font-size: 0.68rem; padding: 0.14rem 0.4rem; }
  .tree-card { padding: 0.35rem 0.15rem 0.7rem; }
}

</style>
<script src="../nav.js"></script>
</head>

<script>
const UI = {"en":{"pageTitle":"Cloudflare Connect 2026 talk summaries","brand":"Cloudflare Connect 2026","subtitle":"13 talk summaries","expandAll":"Expand all","collapseAll":"Collapse all","searchPlaceholder":"Search talks and notes…","searchClear":"Clear search","searchCount":"{n} matches","noMatches":"No matches","themeToDark":"Dark mode","themeToLight":"Light mode","langEn":"EN","langRu":"RU","langSwitchToEn":"Switch to English","langSwitchToRu":"Switch to Russian","youtube":"YouTube","watchOnYoutube":"Watch on YouTube","skipToTree":"Skip to talks","treeLabel":"Talk summaries"},"ru":{"pageTitle":"Конспекты докладов Cloudflare Connect 2026","brand":"Cloudflare Connect 2026","subtitle":"13 конспектов докладов","expandAll":"Развернуть всё","collapseAll":"Свернуть всё","searchPlaceholder":"Поиск по докладам…","searchClear":"Очистить поиск","searchCount":"совпадений: {n}","noMatches":"Совпадений нет","themeToDark":"Тёмная тема","themeToLight":"Светлая тема","langEn":"EN","langRu":"RU","langSwitchToEn":"Переключить на английский","langSwitchToRu":"Переключить на русский","youtube":"YouTube","watchOnYoutube":"Смотреть на YouTube","skipToTree":"К докладам","treeLabel":"Конспекты докладов"}};
const TREE = {"id":"root","type":"root","en":"Cloudflare Connect 2026","ru":"Cloudflare Connect 2026","children":[{"id":"intro","type":"intro","en":"These 13 talks are the videos from the [Cloudflare Connect 2026 playlist](https://www.youtube.com/watch?v=_LYr4dSmdsk&list=PLN--OSeSiMrM). The first two were summarised earlier in this chat; the other 11 were taken from the public YouTube pages. A few names and model names were unclear in the auto-transcript of those 11; those are flagged in place.","ru":"Эти 13 докладов — видео из [плейлиста Cloudflare Connect 2026](https://www.youtube.com/watch?v=_LYr4dSmdsk&list=PLN--OSeSiMrM). Первые два были законспектированы ранее в этом чате; остальные 11 взяты с публичных страниц YouTube. Некоторые имена и названия моделей в автотранскрипте этих 11 были неразборчивы; такие места отмечены в тексте.","children":[]},{"id":"talk-1","type":"talk","en":"Building an open agentic Internet","ru":"Строим открытый агентный интернет","speakerEn":"Michael Tremante.","speakerRu":"Michael Tremante.","url":"https://www.youtube.com/watch?v=_LYr4dSmdsk","accent":0,"children":[{"id":"talk-1-intro","type":"intro","en":"A ~34-minute Cloudflare Connect 2026 talk on building an open “agentic internet”: one agents can read, discover, call, and pay for, without a few big stacks owning discovery, identity, and payments.","ru":"Примерно 34-минутный доклад на Cloudflare Connect 2026 о построении открытого «agentic internet»: такого, который агенты могут читать, обнаруживать, вызывать и оплачивать, без того чтобы несколькими крупными стеками захватывались обнаружение, идентичность и платежи.","children":[]},{"id":"talk-1-sec-1","type":"section","en":"The core problem","ru":"Главная проблема","children":[{"id":"talk-1-sec-1-item-1","type":"item","en":"The core problem is that most traffic Cloudflare sees is now bots, while human visits — and the ad and subscription revenue that depend on them — are falling, because people ask ChatGPT or Claude instead of opening the site.","ru":"Главная проблема в том, что большую часть трафика, который видит Cloudflare, уже составляют боты, а человеческие посещения — и зависящие от них рекламные и подписочные доходы — падают, потому что люди спрашивают ChatGPT или Claude вместо того, чтобы открывать сайт.","children":[]},{"id":"talk-1-sec-1-item-2","type":"item","en":"News publishers are the canary. Referrer data is bleak (he cites Perplexity sending back about one human visit per 3,400 crawls). Big publishers are already signing direct deals with model providers; smaller sites usually can’t.","ru":"Издатели новостей — канарейка в шахте. Данные по реферерам безрадостные (он приводит цифру Perplexity: примерно одно человеческое посещение на 3400 обходов). Крупные издатели уже заключают прямые сделки с поставщиками моделей; небольшие сайты обычно не могут.","children":[]}]},{"id":"talk-1-sec-2","type":"section","en":"Practical fixes, all meant to stay under the site owner’s control in the Cloudflare dashboard","ru":"Практические решения, которые должны оставаться под контролем владельца сайта в панели Cloudflare","children":[{"id":"talk-1-sec-2-item-1","type":"item","en":"A /crawl endpoint, limited to cryptographically signed bots (Web Bot Auth), that serves markdown so crawlers don’t hammer your origin","ru":"Конечная точка /crawl, доступная только криптографически подписанным ботам (Web Bot Auth), которая отдаёт markdown, чтобы краулеры не долбили ваш origin","children":[]},{"id":"talk-1-sec-2-item-2","type":"item","en":"An opt-in open search index of sites behind Cloudflare (about 20% of the web), plus discovery signals — a trial with OpenAI found several million new domains","ru":"Добровольный открытый поисковый индекс сайтов за Cloudflare (около 20% веба) плюс сигналы обнаружения — в пробном проекте с OpenAI нашли несколько миллионов новых доменов","children":[]},{"id":"talk-1-sec-2-item-3","type":"item","en":"Content crawl control, so you can allow access by purpose (training, inference, referral back to your site) and push that as an industry standard","ru":"Content crawl control, чтобы можно было разрешать доступ по цели (обучение, inference, возврат реферального трафика на ваш сайт) и продвигать это как отраслевой стандарт","children":[]},{"id":"talk-1-sec-2-item-4","type":"item","en":"Pay-per-use (still in development, trust-based, with bidding): get paid when a model reuses content after crawling it once","ru":"Pay-per-use (ещё в разработке, на основе доверия, с торгом): получать оплату, когда модель повторно использует контент после того, как один раз его обошла","children":[]},{"id":"talk-1-sec-2-item-5","type":"item","en":"Monetization Gateway (private beta, built on the open x402 standard): charge at access time via HTTP 402 with cryptographic proof of payment — useful for APIs and for smaller players who can’t cut big licensing deals. He also mentions Cloudflare’s Net Dollar stablecoin as part of scaling micropayments.","ru":"Monetization Gateway (закрытая бета, построенная на открытом стандарте x402): брать плату в момент доступа через HTTP 402 с криптографическим доказательством платежа — полезно для API и для более мелких игроков, которые не могут заключить крупные лицензионные сделки. Он также упоминает стейблкоин Cloudflare Net Dollar как часть масштабирования микроплатежей.","children":[]}]},{"id":"talk-1-sec-3","type":"section","en":"Q&A","ru":"Вопросы и ответы","children":[{"id":"talk-1-sec-3-item-1","type":"item","en":"In Q&A he stresses that pricing, blocking, or giving access away is the publisher’s choice; /crawl helps if a bot already knows you exist, while AI Search is how unknown sites get found; and the hard part is the long tail of crawlers (including subscription resellers and residential proxies) trying to bypass all of this.","ru":"В сессии вопросов и ответов он подчёркивает, что цена, блокировка или бесплатный доступ — это выбор издателя; /crawl помогает, если бот уже знает о вашем существовании, а AI Search — это то, как находят неизвестные сайты; и самая трудная часть — длинный хвост краулеров (включая реселлеров подписок и резидентные прокси), которые пытаются всё это обойти.","children":[]}]}]},{"id":"talk-2","type":"talk","en":"It's time to build, not buy","ru":"Пора строить, а не покупать","speakerEn":"Ryan Skidmore, from Cloudflare, who works on developer productivity and AI.","speakerRu":"Ryan Skidmore из Cloudflare, занимается продуктивностью разработчиков и ИИ.","url":"https://www.youtube.com/watch?v=-_qUn_LfJ6M","accent":1,"children":[{"id":"talk-2-intro","type":"intro","en":"His argument: AI has made it realistic to build your own software instead of buying it, but you still have to run and maintain what you build, so the real question is whether you should build it, not whether you can.","ru":"Его аргумент: ИИ сделал реалистичным создавать своё ПО вместо того, чтобы его покупать, но созданное всё равно нужно эксплуатировать и поддерживать, поэтому настоящий вопрос — стоит ли это строить, а не можете ли вы это построить.","children":[]},{"id":"talk-2-sec-1","type":"section","en":"Why the old advice is shifting","ru":"Почему старый совет меняется","children":[{"id":"talk-2-sec-1-item-1","type":"item","en":"\"Don't reinvent the wheel\" used to make sense. Building took months, needed a team and meant someone on call, while buying got you live within weeks.","ru":"«Don't reinvent the wheel» раньше имел смысл. Разработка занимала месяцы, требовала команды и дежурств, а покупка давала запуск за недели.","children":[]},{"id":"talk-2-sec-1-item-2","type":"item","en":"Buying now has its own pain. He cites SaaS prices up 16.4% in a year, 65% of licences going unused, and 79% of IT leads hit with price rises at renewal.","ru":"У покупки теперь своя боль. Он приводит рост цен на SaaS на 16,4% за год, 65% неиспользуемых лицензий и 79% руководителей IT, столкнувшихся с повышением цены при продлении.","children":[]},{"id":"talk-2-sec-1-item-3","type":"item","en":"AI got much cheaper and more capable. For the same benchmark score, the cost of input tokens fell about 75 times between March 2023 and April 2025. On METR's measure of how long a task a model can finish on its own, models went from about 4 minutes with GPT-4 to about 12 hours with Claude Opus 4.6, and the newest models are off the scale.","ru":"ИИ стал гораздо дешевле и сильнее. При том же результате на бенчмарке стоимость входных токенов упала примерно в 75 раз между мартом 2023 и апрелем 2025 года. По мере METR того, насколько длинную задачу модель может закончить самостоятельно, модели прошли путь примерно от 4 минут у GPT-4 до примерно 12 часов у Claude Opus 4.6, а новейшие модели уже за шкалой.","children":[]}]},{"id":"talk-2-sec-2","type":"section","en":"Case study: Cloudflare's internal AI code reviewer","ru":"Кейс: внутренний ИИ-ревьюер кода в Cloudflare","children":[{"id":"talk-2-sec-2-item-1","type":"item","en":"They tried off-the-shelf AI review tools first. None were flexible enough, and vendors wouldn't guarantee what they promised. He built the first version in an afternoon: a git diff and a basic prompt. It's now a much bigger system built on the open-source OpenCode agent and runs in GitLab. About 500 changes have come from people all over the company, which is the big upside of owning the tool.","ru":"Сначала они пробовали готовые инструменты ИИ-ревью. Ни один не был достаточно гибким, и вендоры не гарантировали то, что обещали. Первую версию он собрал за полдень: git diff и простой промпт. Теперь это гораздо более крупная система на открытом агенте OpenCode, работающая в GitLab. Около 500 изменений пришли от людей со всей компании, и в этом главный плюс владения инструментом.","children":[]},{"id":"talk-2-sec-2-item-2","type":"item","en":"Every merge request at Cloudflare has to pass it. It has run just over a million reviews across about 350,000 merge requests and almost 7,000 repositories, and it blocked about 16,000 merges in four months. The wait for a first review went from hours to minutes. Each review now costs $0.67, after they cut their AI bill by 68% through optimisation. There's a fallback so engineers can still ship if an AI provider goes down.","ru":"Каждый merge request в Cloudflare должен через него пройти. Система выполнила чуть больше миллиона ревью на примерно 350 000 merge request'ах и почти 7000 репозиториях и за четыре месяца заблокировала около 16 000 слияний. Ожидание первого ревью сократилось с часов до минут. Каждое ревью теперь стоит $0.67 после того, как они сократили счёт за ИИ на 68% за счёт оптимизации. Есть запасной путь, чтобы инженеры могли выкатывать изменения, если провайдер ИИ упадёт.","children":[]},{"id":"talk-2-sec-2-item-3","type":"item","en":"The lesson: flag only what people will actually act on. Early versions of the reviewer flagged everything they could, assuming more findings meant more value. Engineers said in feedback that a lot of it was nitpicks and minor stuff that didn't need fixing. So they changed it to flag only problems people care about and would actually fix. After that, people acted on a bigger share of the findings, because each one was more important and worth their time. The idea behind it, which he implies but doesn't spell out, is that every comment costs the engineer time to read and decide on. If most of them are trivial, the important ones get lost in the noise. Fewer, better comments get more action.","ru":"Урок: помечать только то, по чему люди действительно будут действовать. Ранние версии ревьюера помечали всё, что могли, исходя из того, что больше находок значит больше пользы. В обратной связи инженеры говорили, что многое из этого было придирками (nitpicks) и мелочами, которые не нужно было исправлять. Поэтому его изменили так, чтобы помечать только проблемы, которые людям важны и которые они действительно исправят. После этого люди реагировали на большую долю находок, потому что каждая из них была важнее и стоила их времени. Идея, которую он подразумевает, но не формулирует явно, в том, что каждый комментарий стоит инженеру времени на чтение и решение. Если большинство из них пустяковые, важные тонут в шуме. Меньше, но более качественных комментариев даёт больше действий.","children":[]},{"id":"talk-2-sec-2-item-4","type":"item","en":"Its limits: it mostly sees only the diff, not the design behind the change. It can't cheaply check the effect on up to 100 connected services, it misses timing-dependent race bugs, and huge changes of millions of lines don't fit in the model's context. It doesn't replace human review.","ru":"Его ограничения: он в основном видит только diff, а не замысел изменения. Он не может дёшево проверить влияние на до 100 связанных сервисов, пропускает гонки, зависящие от тайминга, а огромные изменения на миллионы строк не помещаются в контекст модели. Он не заменяет человеческое ревью.","children":[]}]},{"id":"talk-2-sec-3","type":"section","en":"His rules for build or buy","ru":"Его правила «строить или покупать»","children":[{"id":"talk-2-sec-3-item-1","type":"item","en":"If it's critical and nothing on the market fits, build it. If it's critical and a product fits well, buy it, but make sure you can leave the vendor. If it isn't critical, compare the price with what the tokens to build it would cost, which keeps getting cheaper. Or build something small and see.","ru":"Если это критично и на рынке ничего не подходит, стройте. Если это критично и продукт хорошо подходит, покупайте, но убедитесь, что сможете уйти от вендора. Если это не критично, сравните цену с тем, сколько стоили бы токены на то, чтобы это построить, — а это становится всё дешевле. Или соберите что-то небольшое и посмотрите.","children":[]},{"id":"talk-2-sec-3-item-2","type":"item","en":"Before building, work out exactly what's wrong with your current tool. Prototype in an afternoon, not five weeks. Count security, maintenance and on-call costs. Reuse existing parts (he used OpenCode, Workers KV and AI Gateway), measure everything, and keep a way out.","ru":"Прежде чем строить, точно разберитесь, что не так с текущим инструментом. Прототип — за полдень, а не за пять недель. Учитывайте безопасность, сопровождение и дежурства. Переиспользуйте уже имеющиеся части (он использовал OpenCode, Workers KV и AI Gateway), измеряйте всё и оставляйте себе выход.","children":[]},{"id":"talk-2-sec-3-item-3","type":"item","en":"Expect to replace your tools. With better models, a rebuild in six months may take half the time, so tech debt matters less than solving the problem now.","ru":"Ожидайте, что инструменты придётся заменять. С более сильными моделями переписывание через шесть месяцев может занять вдвое меньше времени, поэтому технический долг менее важен, чем решение проблемы сейчас.","children":[]},{"id":"talk-2-sec-3-item-4","type":"item","en":"Watch out for \"personal software\" sprawl. A thousand employees each building their own version of the same tool is a mess.","ru":"Остерегайтесь расползания «personal software». Тысяча сотрудников, каждый из которых строит свою версию одного и того же инструмента, — это хаос.","children":[]}]},{"id":"talk-2-sec-4","type":"section","en":"Q&A","ru":"Вопросы и ответы","children":[{"id":"talk-2-sec-4-item-1","type":"item","en":"Asked why the reviewer doesn't just run on the developer's laptop: AI isn't deterministic, so they review adversarially from about five angles. A local version exists, but its results are harder to track.","ru":"На вопрос, почему ревьюер не запускается просто на ноутбуке разработчика: ИИ недетерминирован, поэтому они ревьюят состязательно примерно с пяти сторон. Локальная версия есть, но её результаты труднее отслеживать.","children":[]},{"id":"talk-2-sec-4-item-2","type":"item","en":"On standards: they push linters, RFCs and agent skills onto developers' machines so code follows the standards from the start. He says recent models wait for CI, read the review comments and fix them in a loop until the merge request is ready.","ru":"О стандартах: они доставляют линтеры, RFC и навыки агентов на машины разработчиков, чтобы код следовал стандартам с самого начала. Он говорит, что недавние модели ждут CI, читают комментарии ревью и исправляют их в цикле, пока merge request не будет готов.","children":[]}]}],"links":[{"href":"build-not-buy-workflow.html","en":"Process workflow","ru":"Схема процесса"}]},{"id":"talk-3","type":"talk","en":"Break the ceiling of internal productivity with a fast, global filesystem","ru":"Преодолейте потолок внутренней продуктивности с помощью быстрой глобальной файловой системы","speakerEn":"Jackie, co-founder and co-CEO of Relevance AI.","speakerRu":"Jackie, сооснователь и co-CEO компании Relevance AI.","url":"https://www.youtube.com/watch?v=xMg9VDCQVWM","accent":2,"children":[{"id":"talk-3-intro","type":"intro","en":"A five-person team spent three months building Arg, a shared filesystem and workspace for people and agents. That one foundation was enough to ship a productivity suite, an internal app builder, and automated “loops.”","ru":"Команда из пяти человек три месяца строила Arg — общую файловую систему и рабочее пространство для людей и агентов. Этого одного фундамента хватило, чтобы выпустить пакет инструментов продуктивности, внутренний конструктор приложений и автоматизированные «loops».","children":[]},{"id":"talk-3-sec-1","type":"section","en":"Why files, and what they shipped","ru":"Зачем файлы и что они выпустили","children":[{"id":"talk-3-sec-1-item-1","type":"item","en":"On Cloudflare Radar, agentic traffic is a growing share of the internet. Jackie estimates about 60% of visits to a typical website may already come from agents, so teams now have to build for employees and for their agents.","ru":"По данным Cloudflare Radar, агентный трафик занимает всё большую долю интернета. Jackie оценивает, что около 60% посещений типичного сайта уже могут приходиться на агентов, поэтому командам теперь нужно строить продукты и для сотрудников, и для их агентов.","children":[]},{"id":"talk-3-sec-1-item-2","type":"item","en":"Arg stands for Agent Research Group, also nodding to the programming term “arg” and a three-letter domain he already owned. They concluded productivity had to start with files, because apps, databases and documents are all files.","ru":"Arg расшифровывается как Agent Research Group и также отсылает к программному термину «arg» и к трёхбуквенному домену, который у него уже был. Они пришли к выводу, что продуктивность должна начинаться с файлов, потому что приложения, базы данных и документы — всё это файлы.","children":[]},{"id":"talk-3-sec-1-item-3","type":"item","en":"In about three months, with five people — closer to three and a half engineers, he said — they shipped a mobile app, desktop app, CLI, SDK and the workspace. Three surfaces share one versioned filesystem: a suite meant to cover tools such as Google Docs, Notion, Figma, Asana and Dropbox; an internal app builder; and “loops,” or workflow automations. Making the filesystem durable and audited once meant every surface on top got those properties for free.","ru":"Примерно за три месяца команда из пяти человек — ближе к трём с половиной инженерам, как он сказал, — выпустила мобильное приложение, десктопное приложение, CLI, SDK и рабочее пространство. Три поверхности используют одну версионированную файловую систему: набор инструментов, призванный закрыть такие продукты, как Google Docs, Notion, Figma, Asana и Dropbox; внутренний конструктор приложений; и «loops», то есть автоматизации рабочих процессов. Сделав файловую систему надёжной и аудируемой один раз, они бесплатно получили эти свойства на всех поверхностях поверх неё.","children":[]}]},{"id":"talk-3-sec-2","type":"section","en":"Cost, Cloudflare, and results","ru":"Стоимость, Cloudflare и результаты","children":[{"id":"talk-3-sec-2-item-1","type":"item","en":"Using the Google Docs MCP costs about 21 times more tokens than MDX, or about $1,200 extra per agent per year, he said. Forms in Qualtrics or SurveyMonkey were at least nine times more. Leaner formats also scored better in evals on small models such as DeepSeek and Luna.","ru":"Использование MCP для Google Docs обходится примерно в 21 раз большим числом токенов, чем MDX, или примерно на $1,200 больше на агента в год, сказал он. Формы в Qualtrics или SurveyMonkey были как минимум в девять раз дороже. Более компактные форматы также лучше себя показывали в evals на небольших моделях, таких как DeepSeek и Luna.","children":[]},{"id":"talk-3-sec-2-item-2","type":"item","en":"They built on R2 and Durable Objects: Durable Objects for real-time collaboration, R2 for free egress. A custom mount was, he said, up to about 130 times faster on `ls` lookups than standard S3FS. Internal apps run in Cloudflare Sandboxes — they sometimes persist a sandbox and open a tunnel — or via Workers for Platforms. In their tests, Sandbox felt quicker than Modal, especially in Asia and Australia.","ru":"Они строили на R2 и Durable Objects: Durable Objects для совместной работы в реальном времени, R2 ради бесплатного egress. Кастомный mount, по его словам, давал ускорение операций `ls` примерно до 130 раз по сравнению со стандартным S3FS. Внутренние приложения работают в Cloudflare Sandboxes — иногда они сохраняют sandbox и открывают туннель — или через Workers for Platforms. В их тестах Sandbox ощущался быстрее, чем Modal, особенно в Азии и Австралии.","children":[]},{"id":"talk-3-sec-2-item-3","type":"item","en":"Loop engineering means designing the system that prompts the agent, rather than prompting it by hand. Their loops already open pull requests from frontend bugs and customer feedback. One engineer built a 2D, then 3D, farm dashboard where agents produce the work and he approves it, instead of living in GitHub. A go-to-market engineer built a similar factory for content instead of using Salesforce or HubSpot.","ru":"Loop engineering означает проектирование системы, которая формирует запросы агенту, а не ручное составление промптов. Их loops уже открывают pull requests по ошибкам во фронтенде и отзывам клиентов. Один инженер собрал сначала 2D, затем 3D-дашборд фермы, где агенты делают работу, а он её утверждает, вместо того чтобы жить в GitHub. Инженер по go-to-market собрал похожую фабрику для контента вместо использования Salesforce или HubSpot.","children":[]},{"id":"talk-3-sec-2-item-4","type":"item","en":"They had launched about a month earlier. Enterprise use of Arg went from four and a half the previous week to more than ten, including companies such as Databricks, Uber and Canva starting to try it. Jackie said it is now their most popular and stickiest product. His one wishlist item was Cloudflare Postgres.","ru":"К тому моменту они запустились примерно месяцем раньше. Корпоративное использование Arg выросло с четырёх с половиной на предыдущей неделе до более чем десяти, включая такие компании, как Databricks, Uber и Canva, которые начинают его пробовать. Jackie сказал, что теперь это их самый популярный и stickiest продукт. Единственное, чего ему не хватало в списке пожеланий, — Cloudflare Postgres.","children":[]}]}]},{"id":"talk-4","type":"talk","en":"Sentry at Cloudflare Connect: The prompt is lava","ru":"Sentry на Cloudflare Connect: промпт — это лава","speakerEn":"Greg, an engineer at Sentry.","speakerRu":"Greg, инженер в Sentry.","url":"https://www.youtube.com/watch?v=fPfVJ1pd_B4","accent":3,"children":[{"id":"talk-4-intro","type":"intro","en":"Prompt injection is a real risk in observability tools, because attackers can hide instructions in fake errors that agents then follow. Catching that at Sentry’s scale means a cheap first filter on millions of events, not a frontier model on every one.","ru":"Инъекция промптов — реальный риск в инструментах наблюдаемости, потому что злоумышленники могут спрятать инструкции в поддельных ошибках, которые затем выполняют агенты. Чтобы ловить это в масштабах Sentry, нужен дешёвый первичный фильтр на миллионах событий, а не frontier-модель на каждом из них.","children":[]},{"id":"talk-4-sec-1","type":"section","en":"The attack","ru":"Атака","children":[{"id":"talk-4-sec-1-item-1","type":"item","en":"A fetched skill can hide a script or secret instructions that an unsandboxed agent will run. Greg said frontier models were very willing to follow them. The same idea works in observability. Client apps send untrusted telemetry to a public DSN endpoint, which Sentry calls Relay. That data is rolled up into issues, which humans, MCP clients, and Sentry’s debugging agent Seer then read. An attacker can file a bogus error that tells the agent to install a “diagnostics” package whose post-install script steals data. He said this risk exists today on all major observability platforms. The best moment to catch it is before an issue is created, and before webhooks fire.","ru":"Загруженный skill может скрывать скрипт или секретные инструкции, которые выполнит агент без песочницы. Greg сказал, что frontier-модели очень охотно им следовали. Та же идея работает в наблюдаемости. Клиентские приложения отправляют недоверенную телеметрию на публичную DSN-точку, которую в Sentry называют Relay. Эти данные сворачиваются в issues, которые затем читают люди, MCP-клиенты и отладочный агент Sentry под названием Seer. Злоумышленник может отправить фиктивную ошибку, которая велит агенту установить «диагностический» пакет, чей post-install скрипт крадёт данные. Он сказал, что этот риск уже существует сегодня на всех крупных платформах наблюдаемости. Лучший момент, чтобы это поймать, — до создания issue и до срабатывания webhooks.","children":[]}]},{"id":"talk-4-sec-2","type":"section","en":"The pipeline","ru":"Конвейер","children":[{"id":"talk-4-sec-2-item-1","type":"item","en":"Asking a large model such as Opus on every event worked in tests, but was too slow and expensive. They see on the order of 100 actually malicious events a day, while processing hundreds of millions of events. A heuristic now sends about 10 million events a day into detection. He wants that closer to a billion, and would not describe the heuristic, because it could be bypassed.","ru":"Запрос к большой модели, такой как Opus, на каждом событии работал в тестах, но был слишком медленным и дорогим. Они видят порядка 100 действительно вредоносных событий в день при обработке сотен миллионов событий. Эвристика сейчас отправляет в детекцию около 10 миллионов событий в день. Он хочет приблизить это к миллиарду и не стал описывать эвристику, потому что её можно было бы обойти.","children":[]},{"id":"talk-4-sec-2-item-2","type":"item","en":"Until about the end of August, a small model (the transcript sounds like “GPT-3 SS”) was their best option. In September they moved to “decision models,” which return a 0–1 malice score. Those were about three times cheaper than their cheapest language model, and more accurate, but still not cheap enough at 100 times the volume. Some, including ones he called Mercury Decider and Perplexity Decider, also flagged many benign issues, which would have sent around half a million events to the expensive reviewer.","ru":"Примерно до конца августа лучшим вариантом была небольшая модель (в транскрипте звучит как «GPT-3 SS»). В сентябре они перешли на «decision models», которые возвращают оценку вредоносности от 0 до 1. Те оказались примерно в три раза дешевле их самой дешёвой языковой модели и точнее, но всё ещё недостаточно дёшевы при стократном росте объёма. Некоторые, в том числе те, что он назвал Mercury Decider и Perplexity Decider, также помечали много безобидных issues, из-за чего к дорогому ревьюеру уходило бы около полумиллиона событий.","children":[]},{"id":"talk-4-sec-2-item-3","type":"item","en":"They started fine-tuning text encoders such as MMBERT and ModernBERT, around 150 million parameters, and reached more than 90% accuracy without a full labeling loop yet. On a similar load, on “not too many GPUs,” he put the cost at about 12K; at 100 times the volume, he thought that could stay this side of a million-dollar bill. A further idea, still hypothetical, is distilling into a roughly 4-million-parameter model, about $700 a day on full load — he said a slide figure was wrong — and well under 1 millisecond per event.","ru":"Они начали дообучать текстовые энкодеры, такие как MMBERT и ModernBERT, примерно на 150 миллионах параметров, и достигли точности выше 90% ещё без полного цикла разметки. На схожей нагрузке, «на не слишком большом числе GPU», он оценил стоимость примерно в 12K; при стократном объёме, он полагал, это могло бы удержаться по эту сторону миллионного счёта. Дальнейшая идея, пока гипотетическая, — дистилляция в модель примерно на 4 миллиона параметров, около $700 в день на полной нагрузке — он сказал, что цифра на слайде была неверной, — и существенно меньше 1 миллисекунды на событие.","children":[]}]},{"id":"talk-4-sec-3","type":"section","en":"Q&A","ru":"Вопросы и ответы","children":[{"id":"talk-4-sec-3-item-1","type":"item","en":"Classification runs on rented L4 GPUs in GCP; they self-host their own classifiers. A classifier alone is not enough; he would also check mentioned packages. The distilled model will go live when it matches or beats current accuracy. Seer is a more expensive backstop. They considered scanning only when someone fetches an issue, but saw that as largely duplicative.","ru":"Классификация работает на арендованных GPU L4 в GCP; классификаторы они хостят сами. Одного классификатора недостаточно; он также проверял бы упоминаемые пакеты. Дистиллированная модель выйдет в прод, когда сравняется с текущей точностью или превзойдёт её. Seer — более дорогая страховка. Они рассматривали сканирование только в момент, когда кто-то запрашивает issue, но сочли это в значительной степени дублированием.","children":[]}]}]},{"id":"talk-5","type":"talk","en":"Turning data questions into data infra with Cloudflare Basin","ru":"Превращаем вопросы о данных в инфраструктуру данных с помощью Cloudflare Basin","speakerEn":"Micah, a principal engineer at Cloudflare and tech lead for Cloudflare Basin.","speakerRu":"Micah, principal engineer в Cloudflare и технический руководитель Cloudflare Basin.","url":"https://www.youtube.com/watch?v=NlRTSleUkE0","accent":4,"children":[{"id":"talk-5-intro","type":"intro","en":"Basin is Cloudflare’s new serverless data-infrastructure suite — a catalog, pipelines, and a SQL engine — built so an agent can ask a question, notice missing data, instrument the app, and query the results without weeks of hand-offs between data and application teams.","ru":"Basin — новый бессерверный набор инструментов инфраструктуры данных от Cloudflare: каталог, конвейеры и SQL-движок. Он построен так, чтобы агент мог задать вопрос, заметить недостающие данные, инструментировать приложение и запросить результаты без недель перекидывания задач между командами данных и разработки.","children":[]},{"id":"talk-5-sec-1","type":"section","en":"The old loop, and a live demo","ru":"Старый цикл и живое демо","children":[{"id":"talk-5-sec-1-item-1","type":"item","en":"He framed the talk as CEO of a fictional mountaineering shop, “Basin Mountain.” Sales are down, traffic looks normal, but checkout events were never instrumented. In the usual process a data team files a ticket, application engineers add events weeks later, then a pipeline is built. He has seen that cycle hundreds of times, and by the time the answer arrives it is often too late.","ru":"Он построил доклад от лица CEO вымышленного магазина снаряжения для альпинизма «Basin Mountain». Продажи падают, трафик выглядит нормально, но события оформления заказа так и не были инструментированы. В обычном процессе команда данных заводит тикет, инженеры приложения добавляют события неделями позже, затем строится конвейер. Он видел этот цикл сотни раз, и к моменту, когда ответ приходит, часто уже слишком поздно.","children":[]},{"id":"talk-5-sec-1-item-2","type":"item","en":"With conference Wi-Fi and Claude, he asked for order volume, then why orders were low. The assistant found traffic steady and conversions later dropping, but could not explain the gap because the data was missing. He asked it to instrument the checkout flow. At the end, Claude had added instrumentation and created the pipeline and catalog resources, ready to deploy.","ru":"С конференционным Wi-Fi и Claude он спросил об объёме заказов, а затем — почему заказов мало. Ассистент обнаружил, что трафик стабилен, а конверсии позже падают, но не мог объяснить разрыв, потому что данных не было. Он попросил инструментировать поток оформления заказа. В итоге Claude добавил инструментацию и создал ресурсы конвейера и каталога, готовые к развёртыванию.","children":[]}]},{"id":"talk-5-sec-2","type":"section","en":"The three products","ru":"Три продукта","children":[{"id":"talk-5-sec-2-item-1","type":"item","en":"All three went generally available about three weeks earlier at Birthday Week, billed serverless with no long-term commit. **Basin Catalog** is a managed Apache Iceberg catalog on R2, which does not charge egress fees. Spark, Snowflake, Databricks, DuckDB and PyIceberg can all query it, and compaction is automatic if you turn it on. **Basin Pipelines** ingest via a Worker binding, HTTP, or Logpush from Cloudflare’s CDN and security products, and you can reshape events with SQL before they land. Logpush is now available to everyone, not only enterprise customers. **Basin SQL** is a distributed query engine across the Cloudflare edge. He said it can scale to petabytes, and that highly parallel queries can scan petabytes in seconds.","ru":"Все три стали общедоступны примерно тремя неделями раньше на Birthday Week, с бессерверной оплатой без долгосрочных обязательств. **Basin Catalog** — управляемый каталог Apache Iceberg на R2, без платы за egress. Spark, Snowflake, Databricks, DuckDB и PyIceberg могут его запрашивать, а compaction выполняется автоматически, если его включить. **Basin Pipelines** принимают данные через привязку Worker (binding), HTTP или Logpush из CDN и продуктов безопасности Cloudflare, и события можно преобразовывать с помощью SQL до записи. Logpush теперь доступен всем, а не только корпоративным клиентам. **Basin SQL** — распределённый движок запросов по edge-сети Cloudflare. Он сказал, что тот может масштабироваться до петабайт, а сильно параллельные запросы могут сканировать петабайты за секунды.","children":[]}]},{"id":"talk-5-sec-3","type":"section","en":"Why it fits agents, and Q&A","ru":"Почему это подходит агентам, и вопросы и ответы","children":[{"id":"talk-5-sec-3-item-1","type":"item","en":"They started building about two years ago, so agents can create, inspect and tear down resources through an API and CLI, with no cluster sizing or contracts. Cloudflare’s cache keeps repeated agent queries from going back to cold storage. His practical advice in 2026 was to tell Claude to instrument the app with Basin.","ru":"Они начали разработку примерно два года назад, так что агенты могут создавать, просматривать и удалять ресурсы через API и CLI, без подбора размера кластера и контрактов. Кэш Cloudflare не даёт повторным запросам агентов возвращаться к холодному хранилищу. Его практический совет в 2026 году — сказать Claude инструментировать приложение с помощью Basin.","children":[]},{"id":"talk-5-sec-3-item-2","type":"item","en":"On conflicting definitions of “revenue,” he said this is still hard: it helps if the agent can see the collecting code and the pipelines, but humans still need to agree what the numbers mean. Jurisdiction limits on where compute and storage live, for example in the EU or the US, are not available yet, but are coming in Q4. Custom role-based access control, such as HR-only performance reviews, is not available today, but is coming soon. He has thought about a “Basin for Platforms” isolation model, but did not announce it.","ru":"Относительно конфликтующих определений «выручки» он сказал, что это по-прежнему сложно: помогает, если агент видит код сбора данных и конвейеры, но людям всё равно нужно договориться, что означают цифры. Ограничения юрисдикции на размещение вычислений и хранения, например в ЕС или США, пока недоступны, но появятся в Q4. Пользовательское ролевое управление доступом, например отзывы об эффективности только для HR, сегодня недоступно, но появится в ближайшее время. Он думал об изоляционной модели «Basin for Platforms», но не анонсировал её.","children":[]}]}]},{"id":"talk-6","type":"talk","en":"TanStack Start on Workers: Server-rendering apps an AI just wrote","ru":"TanStack Start на Workers: серверный рендеринг приложений, которые только что написал ИИ","speakerEn":"Fabian, from Lovable.","speakerRu":"Fabian из Lovable.","url":"https://www.youtube.com/watch?v=CkGY-wtQ0Q0","accent":5,"children":[{"id":"talk-6-intro","type":"intro","en":"Lovable moved from static React apps in R2 to server-rendered TanStack Start apps on Cloudflare’s dynamic Workers, so it can host tens of millions of AI-generated apps on demand — including Lovable itself — with cold starts under a second.","ru":"Lovable перешла от статических React-приложений в R2 к приложениям на TanStack Start с серверным рендерингом на динамических Workers Cloudflare, чтобы по требованию размещать десятки миллионов сгенерированных ИИ приложений — включая сам Lovable — с холодным стартом менее секунды.","children":[]},{"id":"talk-6-sec-1","type":"section","en":"Scale, and the migration","ru":"Масштаб и миграция","children":[{"id":"talk-6-sec-1-item-1","type":"item","en":"Since launch they have created 70 million applications, about 1 million new ones a week. Those apps get more than 1 billion visits a month. A Cloudflare contact in the room had given him a fresh figure of about 7 billion requests a day to these Workers. That is far too many apps to keep warm on traditional servers.","ru":"С момента запуска они создали 70 миллионов приложений, около 1 миллиона новых в неделю. Эти приложения получают более 1 миллиарда посещений в месяц. Контакт из Cloudflare в зале назвал ему свежую цифру: около 7 миллиардов запросов в день к этим Workers. Приложений слишком много, чтобы держать их «тёплыми» на традиционных серверах.","children":[]},{"id":"talk-6-sec-1-item-2","type":"item","en":"They started with client-rendered React apps, serving static assets from R2, always on Vite. Earlier this year they moved to TanStack Start, mainly for SEO through server-side rendering, and because one isomorphic codebase is easier for an AI to work with. Routes can still be marked static when they do not need compute.","ru":"Они начинали с клиентского рендеринга React-приложений, отдавая статику из R2, всегда на Vite. В начале этого года они перешли на TanStack Start, главным образом ради SEO за счёт серверного рендеринга и потому что одна изоморфная кодовая база проще для работы ИИ. Маршруты по-прежнему можно помечать как статические, если им не нужны вычисления.","children":[]}]},{"id":"talk-6-sec-2","type":"section","en":"How serving works","ru":"Как работает отдача","children":[{"id":"talk-6-sec-2-item-1","type":"item","en":"In March, Cloudflare released dynamic Workers, which let a normal Worker spawn another Worker. App code lives in R2 and is cached in KV. A single proxy Worker receives every request, such as `myapp.lovable.app`, looks up the code location, latest version and access rules, then either serves static files itself or starts a dynamic Worker. Cold start from fully cold in R2 to a ready Worker is less than one second, which he said most users never notice.","ru":"В марте Cloudflare выпустили динамические Workers, которые позволяют обычному Worker порождать другой Worker. Код приложения живёт в R2 и кэшируется в KV. Один прокси-Worker принимает каждый запрос, например `myapp.lovable.app`, смотрит расположение кода, последнюю версию и правила доступа, затем либо сам отдаёт статику, либо запускает динамический Worker. Холодный старт от полностью холодного состояния в R2 до готового Worker занимает меньше секунды, и, по его словам, большинство пользователей этого не замечают.","children":[]},{"id":"talk-6-sec-2-item-2","type":"item","en":"Server rendering “dehydrates” HTML and data so the browser can paint before any client JavaScript runs, then hydrate for interactivity. Functions with secrets run on the server; TanStack Start replaces them with request stubs in the browser. Secrets are stored encrypted and bound into the dynamic Worker at startup. A secret change invalidates the isolate and starts a new Worker without a new app deployment.","ru":"Серверный рендеринг «дегидрирует» HTML и данные, чтобы браузер мог отрисовать страницу до запуска клиентского JavaScript, а затем гидратирует её для интерактивности. Функции с секретами выполняются на сервере; TanStack Start подменяет их в браузере заглушками запросов. Секреты хранятся в зашифрованном виде и привязываются к динамическому Worker при запуске. Смена секрета инвалидирует изолят и запускает новый Worker без нового развёртывания приложения.","children":[]}]},{"id":"talk-6-sec-3","type":"section","en":"Dogfooding and lessons","ru":"Dogfooding и уроки","children":[{"id":"talk-6-sec-3-item-1","type":"item","en":"The largest app on Lovable today is Lovable itself, migrated from Next.js onto this stack so scaling problems show up internally first. Each isolate has a soft limit of 128 MB. After the migration they hit out-of-memory errors from leaking a TypeScript compiler and a syntax highlighter into the server bundle. Those lessons are now encoded into the builder agent that produces more than a million apps a week. Cold starts are the expensive part, so they cache bundles in KV, keep them small, and pre-render at publish time — within 10 seconds, he said — serving static HTML when they can. He credited close work with Tanner and the TanStack team. He offered to stay for questions; the recording has no formal Q&A.","ru":"Самое большое приложение на Lovable сегодня — сам Lovable, перенесённый с Next.js на этот стек, чтобы проблемы масштабирования сначала проявлялись внутри. У каждого изолята мягкий лимит 128 МБ. После миграции они столкнулись с ошибками нехватки памяти из-за того, что компилятор TypeScript и подсветка синтаксиса попали в серверный бандл и давали утечку. Эти уроки теперь заложены в агент-сборщик, который производит больше миллиона приложений в неделю. Холодный старт — самая дорогая часть, поэтому они кэшируют бандлы в KV, держат их маленькими и заранее рендерят в момент публикации — в течение 10 секунд, как он сказал, — отдавая статический HTML, когда можно. Он отметил тесную работу с Tanner и командой TanStack. Он предложил остаться для вопросов; в записи формальной сессии вопросов и ответов нет.","children":[]}]}]},{"id":"talk-7","type":"talk","en":"Generative media's breakthrough moment: Insights from Runway","ru":"Прорывной момент генеративных медиа: выводы от Runway","speakerEn":"A conversation between a Cloudflare host (he refers to himself as Mark) and Anthony, Chief Product Officer at Runway, in the role about four months. Runway builds video and world models, plus apps for marketers, creatives and developers.","speakerRu":"Разговор между ведущим от Cloudflare (он называет себя Mark) и Anthony, Chief Product Officer в Runway, в этой роли около четырёх месяцев. Runway создаёт видео- и world-модели, а также приложения для маркетологов, креативщиков и разработчиков.","url":"https://www.youtube.com/watch?v=-gfvKxhNbaw","accent":6,"children":[{"id":"talk-7-intro","type":"intro","en":"Anthony argued that generative media is in the same kind of mass-adoption moment coding hit after models such as Opus 4.5: a small share of teams already produce production-ready work at surprising speed, and that is starting to spread.","ru":"Anthony утверждал, что генеративные медиа находятся в том же роде момента массового внедрения, который кодирование пережило после моделей вроде Opus 4.5: небольшая доля команд уже выпускает готовые к продакшену работы с удивительной скоростью, и это начинает распространяться.","children":[]},{"id":"talk-7-sec-1","type":"section","en":"What teams are already doing","ru":"Что команды уже делают","children":[{"id":"talk-7-sec-1-item-1","type":"item","en":"He estimated that about 10 to 15% of people on a typical creative or marketing team have already figured out how to use these models at a high level.","ru":"Он оценил, что примерно 10–15% людей в типичной креативной или маркетинговой команде уже разобрались, как использовать эти модели на высоком уровне.","children":[]},{"id":"talk-7-sec-1-item-2","type":"item","en":"Amazon MGM used video models on *House of David* and, in some areas and scenes, cut post-production from five months to a couple of days. Chime wanted a TV spot showing hundreds of members rather than about nine. Members sent photos, those became video, and it aired on television in a couple of days, versus a budget of several hundred thousand dollars and weeks of shooting. A major studio green-lit a docu-series mixing human interviews with AI-generated historical footage because the lower cost reduced the risk. A self-serve user gave a coding agent a Runway budget under $100, and it turned blog posts into a YouTube how-to series.","ru":"Amazon MGM использовали видеомодели на *House of David* и в некоторых областях и сценах сократили постпродакшн с пяти месяцев до пары дней. Chime хотели рекламный ролик для ТВ с сотнями участников, а не примерно с девятью. Участники присылали фотографии, из них делали видео, и ролик вышел в эфир за пару дней — против бюджета в несколько сотен тысяч долларов и недель съёмок. Крупная студия дала зелёный свет документальному сериалу, смешивающему человеческие интервью с историческими кадрами, сгенерированными ИИ, потому что более низкая стоимость снизила риск. Пользователь self-serve дал агенту для кода бюджет Runway меньше $100, и тот превратил посты в блоге в серию обучающих роликов на YouTube.","children":[]}]},{"id":"talk-7-sec-2","type":"section","en":"Products and use cases","ru":"Продукты и сценарии использования","children":[{"id":"talk-7-sec-2-item-1","type":"item","en":"Runway Agent acts as a video producer: it takes a brief, plans scenes, character references, audio and lip-sync, and calls a mix of video, audio, image and editing models. He said quality is also rising because each new frontier language model — he mentioned examples such as Opus 5.5 and Astra — makes the production agent better at one-shot results. In July they released a media model router for developers, which he said was an industry first. An average developer, he said, sees about a 66% cost reduction versus always using the most expensive model.","ru":"Runway Agent выступает как видеопродюсер: берёт бриф, планирует сцены, референсы персонажей, аудио и липсинк и вызывает набор моделей для видео, аудио, изображений и монтажа. Он сказал, что качество также растёт, потому что каждая новая frontier-языковая модель — он упомянул такие примеры, как Opus 5.5 и Astra — делает продакшен-агента лучше в результатах с одного прохода (one-shot). В июле они выпустили маршрутизатор медиамоделей для разработчиков, который, по его словам, стал первым в отрасли. Средний разработчик, сказал он, видит снижение стоимости примерно на 66% по сравнению с постоянным использованием самой дорогой модели.","children":[]},{"id":"talk-7-sec-2-item-2","type":"item","en":"He recommended true localization, not just translated copy: a commercial shot in New York can be made to feel built for London or Brazil. A European customer with a content team of about 15 people now localizes every market and campaign. He also uses generated slide visuals instead of hunting stock photos, and said internal video teams now send back regenerated variations of a speaker instead of asking for a reshoot.","ru":"Он рекомендовал настоящую локализацию, а не просто переведённые тексты: рекламу, снятую в Нью-Йорке, можно сделать ощущающейся созданной для Лондона или Бразилии. Европейский клиент с контентной командой примерно из 15 человек теперь локализует каждый рынок и каждую кампанию. Он также использует сгенерированные визуалы для слайдов вместо поиска стоковых фото и сказал, что внутренние видеокоманды теперь присылают обратно перегенерированные варианты выступающего вместо просьбы о пересъёмке.","children":[]}]},{"id":"talk-7-sec-3","type":"section","en":"What’s next, and Q&A","ru":"Что дальше и вопросы и ответы","children":[{"id":"talk-7-sec-3-item-1","type":"item","en":"Real-time video generation is becoming faster than people can watch. Runway is developing a video model that can power a software interface: a live, clickable video, for example a virtual dressing room or a visualized travel itinerary. He confirmed this is the Solaris world model. It is with a few design partners and is opening to more each week; it is not generally available yet.","ru":"Генерация видео в реальном времени становится быстрее, чем люди успевают смотреть. Runway разрабатывает видеомодель, которая может двигать программный интерфейс: живое кликабельное видео, например виртуальная примерочная или визуализированный маршрут путешествия. Он подтвердил, что это world-модель Solaris. Сейчас она у нескольких дизайн-партнёров и каждую неделю открывается для новых; в общей доступности её ещё нет.","children":[]},{"id":"talk-7-sec-3-item-2","type":"item","en":"Asked how stylists and makeup artists fit in, he said art direction and taste are not going away; the skill is turning a brief into prompts so the output does not all look the same. Asked about video made for language models and agents as well as humans, he had not seen much of that yet on the video side, but expected it would come.","ru":"На вопрос, как в это вписываются стилисты и визажисты, он сказал, что арт-направление и вкус никуда не денутся; навык состоит в том, чтобы превратить бриф в промпты так, чтобы результат не выглядел одинаково. На вопрос о видео, сделанном для языковых моделей и агентов, а не только для людей, он пока мало такого видел на стороне видео, но ожидал, что это появится.","children":[]}]}]},{"id":"talk-8","type":"talk","en":"An agent that onboards a photography studio — on Workers AI","ru":"Агент, который вводит в работу фотостудию — на Workers AI","speakerEn":"Andreas Salme, senior director of software engineering at Disco, a photography platform for capture, editing, community, and the business side of a studio.","speakerRu":"Andreas Salme, старший директор по программной инженерии в Disco, платформе для фотографов, охватывающей съёмку, обработку, сообщество и бизнес-сторону студии.","url":"https://www.youtube.com/watch?v=I4AMpO2KCTA","accent":7,"children":[{"id":"talk-8-intro","type":"intro","en":"Disco built Scout, an in-product agent on Workers AI, to do real CRM work for photographers — invoices, jobs, contracts — and found that creatives accept AI much more readily on the business side than in the creative tools themselves.","ru":"Disco создали Scout, встроенного в продукт агента на Workers AI, для настоящей CRM-работы фотографов — счета, заказы, договоры — и обнаружили, что креативщики гораздо охотнее принимают ИИ на бизнес-стороне, чем в самих творческих инструментах.","children":[]},{"id":"talk-8-sec-1","type":"section","en":"The problem, and what Scout does","ru":"Проблема и что делает Scout","children":[{"id":"talk-8-sec-1-item-1","type":"item","en":"Workspace is Disco’s CRM for automations, quotes, contracts, leads and payments. Photographers often know the outcome they want, such as “send an invoice,” but not where to click, and actions have dependencies: an invoice needs a job and a client record.","ru":"Workspace — это CRM Disco для автоматизаций, коммерческих предложений, договоров, лидов и платежей. Фотографы часто знают желаемый результат, например «отправь счёт», но не знают, куда нажать, а у действий есть зависимости: для счёта нужны заказ (job) и запись клиента.","children":[]},{"id":"talk-8-sec-1-item-2","type":"item","en":"Scout is a multi-turn chat assistant inside the web app. It began as a guarded onboarding helper and has since grown to day-to-day studio work. It must actually read and write studio data, never claim success without re-reading the record, hand off a deep link if it cannot finish, respect three subscription tiers, remember conversations across devices, ask clarifying questions, and stream replies. The same agent runs in two harnesses: the full classic CRM for Disco One subscribers, and Atlas, a smaller CRM for freemium and other paid plans, with different wording on each surface.","ru":"Scout — многоходовый чат-ассистент внутри веб-приложения. Он начинался как осторожный помощник по онбордингу и с тех пор вырос до повседневной работы студии. Он должен реально читать и записывать данные студии, никогда не заявлять об успехе без повторного чтения записи, передавать deep link, если не может закончить, учитывать три тарифных уровня, помнить разговоры на разных устройствах, задавать уточняющие вопросы и стримить ответы. Один и тот же агент работает в двух harnesses: полной классической CRM для подписчиков Disco One и Atlas, более лёгкой CRM для freemium и других платных планов, с разной формулировкой на каждой поверхности.","children":[]}]},{"id":"talk-8-sec-2","type":"section","en":"How it is built","ru":"Как это устроено","children":[{"id":"talk-8-sec-2-item-1","type":"item","en":"A turn such as “create an invoice for this job” loads the thread, current page and studio settings, then calls a model on Workers AI. The system checks the plan tier and preconditions, mutates data, verifies the write, and streams back a card linking to the invoice. Each action is a declarative capability tied to a tier, so adding one is a data and adapter change, not a model retraining.","ru":"На ход вроде «создай счёт для этого заказа» загружаются тред, текущая страница и настройки студии, затем вызывается модель на Workers AI. Система проверяет тариф и предусловия, изменяет данные, проверяет запись и стримит обратно карточку со ссылкой на счёт. Каждое действие — декларативная возможность, привязанная к тарифу, поэтому добавление нового — это изменение данных и адаптера, а не переобучение модели.","children":[]},{"id":"talk-8-sec-2-item-2","type":"item","en":"They used LangChain, LangGraph, deep agents, and an AG-UI bridge to stream graph events. They picked Workers AI to move quickly, stay model-agnostic with an OpenAI-compatible API, and reuse prior Disco experience. He said they are currently running GLM-class models after testing several. Not all of the stack runs on Cloudflare; his point was that you can adopt pieces of the platform without moving all compute there.","ru":"Они использовали LangChain, LangGraph, deep agents и мост AG-UI для стриминга событий графа. Workers AI они выбрали, чтобы двигаться быстро, оставаться независимыми от модели благодаря OpenAI-совместимому API и опереться на предыдущий опыт Disco. Он сказал, что сейчас они работают с моделями класса GLM после тестирования нескольких. Не весь стек работает на Cloudflare; его мысль была в том, что можно взять отдельные части платформы, не перенося туда все вычисления.","children":[]}]},{"id":"talk-8-sec-3","type":"section","en":"What’s next, and Q&A","ru":"Что дальше и вопросы и ответы","children":[{"id":"talk-8-sec-3-item-1","type":"item","en":"More of the Workspace UI will be exposed as APIs. They want to keep evaluating models, look at Durable Objects — which he felt they had underused — and try a newly released decision model (the name is unclear in the transcript) to manage token spend. Conversation state today uses a key-value store; the transcript sounds like Valkey.","ru":"Больше элементов интерфейса Workspace будет открыто как API. Они хотят продолжать оценивать модели, присмотреться к Durable Objects — которые, как ему казалось, они недоиспользовали — и попробовать недавно выпущенную decision model (название в транскрипте неразборчиво), чтобы управлять расходом токенов. Состояние разговора сегодня хранится в key-value хранилище; в транскрипте звучит как Valkey.","children":[]},{"id":"talk-8-sec-3-item-2","type":"item","en":"If he started over, he would have put in fewer guardrails, because users quickly tried to do more than onboarding, and he would have looked at Durable Objects sooner. Sensitive data stays in Disco’s own infrastructure; the model is used to choose the next step, not to receive that context. The project started in the summer with two people. They summarize long context before inference to control cost; he did not share exact spend figures. AI in the photo editor has been more polarizing; in the business product they have not had pushback, as long as it is not placed first in editing flows.","ru":"Если бы он начинал заново, он поставил бы меньше guardrails, потому что пользователи быстро пытались делать больше, чем онбординг, и раньше посмотрел бы на Durable Objects. Чувствительные данные остаются в собственной инфраструктуре Disco; модель используется, чтобы выбрать следующий шаг, а не для того, чтобы получать этот контекст. Проект начался летом с двух человек. Длинный контекст они суммаризируют перед inference, чтобы контролировать стоимость; точных цифр расходов он не назвал. ИИ в фоторедакторе вызывал больше споров; в бизнес-продукте возражений не было, пока его не ставят на первое место в потоках редактирования.","children":[]}]}]},{"id":"talk-9","type":"talk","en":"Why modern software engineering needs Durable Objects","ru":"Почему современной разработке ПО нужны Durable Objects","speakerEn":"Ashley Peacock, who joined Cloudflare about six months earlier to work on Durable Objects, and has been building with them since around 2022.","speakerRu":"Ashley Peacock, который присоединился к Cloudflare примерно шесть месяцев назад, чтобы работать над Durable Objects, и строит на них примерно с 2022 года.","url":"https://www.youtube.com/watch?v=75jxhU6z3ho","accent":8,"children":[{"id":"talk-9-intro","type":"intro","en":"Durable Objects isolate state into many tiny servers with their own SQLite databases, so a flood of AI traffic or a busy user is less likely to take down a whole app, and they are a cheap place to run large numbers of agents.","ru":"Durable Objects изолируют состояние в множество крошечных серверов с собственными базами SQLite, поэтому волна ИИ-трафика или активный пользователь с меньшей вероятностью положит всё приложение, и это дешёвое место для запуска большого числа агентов.","children":[]},{"id":"talk-9-sec-1","type":"section","en":"Why they matter now","ru":"Почему они важны сейчас","children":[{"id":"talk-9-sec-1-item-1","type":"item","en":"Cloudflare had just reported that AI agent traffic grew by more than 1,700% in the past year. He also showed GitHub availability struggling under the AI wave. Shared databases and containers are hard to scale overnight if an app goes viral. Databricks had seen a 327% increase in multi-agent systems in the past four months. McKinsey, he said, found organizations using AI rose from 20% to 90% between 2017 and 2025.","ru":"Cloudflare только что сообщили, что трафик ИИ-агентов вырос более чем на 1700% за прошедший год. Он также показал, как доступность GitHub страдает под волной ИИ. Общие базы данных и контейнеры трудно масштабировать за ночь, если приложение вдруг «взлетит». Databricks зафиксировали рост мультиагентных систем на 327% за последние четыре месяца. McKinsey, по его словам, выяснили, что доля организаций, использующих ИИ, выросла с 20% до 90% между 2017 и 2025 годами.","children":[]},{"id":"talk-9-sec-1-item-2","type":"item","en":"He described a Durable Object as “a small but mighty server with its own database.” Each can handle up to 1,000 requests per second, has up to 10 GB of SQLite and 128 MB of memory, and is addressed by a globally unique name, so only one instance exists at a time. Because each object has its own database on the same machine, there is no lock contention across users. He said reads typically complete in less than 1 microsecond. Objects are created on demand and scale to zero when idle. Cloudflare’s Agents SDK sits on them and includes WebSockets, sub-agents, scheduled tasks, tools and MCP. Isolates, he said, are roughly 100 times more efficient than containers.","ru":"Он описал Durable Object как «небольшой, но мощный сервер с собственной базой данных». Каждый может обрабатывать до 1000 запросов в секунду, имеет до 10 ГБ SQLite и 128 МБ памяти и адресуется по глобально уникальному имени, так что в один момент существует только один экземпляр. Поскольку у каждого объекта своя база на той же машине, нет конкуренции за блокировки между пользователями. Он сказал, что чтения обычно завершаются менее чем за 1 микросекунду. Объекты создаются по требованию и масштабируются до нуля, когда простаивают. Agents SDK от Cloudflare построен на них и включает WebSockets, субагентов, отложенные задачи, инструменты и MCP. Изоляты, по его словам, примерно в 100 раз эффективнее контейнеров.","children":[]}]},{"id":"talk-9-sec-2","type":"section","en":"How to design them, and new features","ru":"Как их проектировать и новые возможности","children":[{"id":"talk-9-sec-2-item-1","type":"item","en":"Avoid the “hot singleton.” One object per Slack workspace would crumple under 1,000 requests per second. Prefer smaller units, such as a channel, and fan out broadcasts across many objects. Place objects near the user, not near a central AWS or Azure backend. Use Cloudflare’s WebSocket APIs so the object can hibernate while the connection stays open at no charge. In-memory fields are wiped on hibernation; anything critical must go to SQLite. Objects are single-threaded, so for parallel tasks he would go even smaller — one object per conversation or task, not per user. For organization-wide settings he suggested D1, which he said is itself a Durable Object with a nicer API and read replicas, and warned against long chains of objects.","ru":"Избегайте «горячего синглтона». Один объект на Slack-workspace не выдержит 1000 запросов в секунду. Предпочитайте более мелкие единицы, например канал, и рассылайте широковещательные сообщения через множество объектов. Размещайте объекты рядом с пользователем, а не рядом с центральным бэкендом в AWS или Azure. Используйте WebSocket API Cloudflare, чтобы объект мог уходить в гибернацию, пока соединение остаётся открытым бесплатно. Поля в памяти стираются при гибернации; всё критичное должно попадать в SQLite. Объекты однопоточные, поэтому для параллельных задач он шёл бы ещё мельче — один объект на разговор или задачу, а не на пользователя. Для общеорганизационных настроек он предложил D1, который, по его словам, сам является Durable Object с более удобным API и репликами для чтения, и предостерёг от длинных цепочек объектов.","children":[]},{"id":"talk-9-sec-2-item-2","type":"item","en":"Some newer features were not fully public yet. With pending I/O, an object can stay alive for up to 15 minutes, extended by each new external request, so a model call can finish after the client disconnects. A shutdown hook lets you flush state. On deploy, WebSockets migrate to the new code without client errors, and old code can keep running on a busy object for up to 24 hours, up from 30 seconds. The platform will also automatically retry failed requests when it is safe. Public APIs should live on a Worker, with Durable Objects behind them. Hyperdrive can pool existing Postgres or MySQL connections. He had not measured whether calling Cloudflare-hosted models from a Durable Object is lower-latency, and would not promise it.","ru":"Некоторые новые возможности ещё не были полностью публичными. С pending I/O объект может оставаться живым до 15 минут, продлеваясь каждым новым внешним запросом, так что вызов модели может завершиться после отключения клиента. Shutdown hook позволяет сбросить состояние. При деплое WebSockets переезжают на новый код без ошибок у клиента, а старый код может продолжать работать на занятом об
