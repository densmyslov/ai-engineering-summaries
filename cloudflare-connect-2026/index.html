ъекте до 24 часов вместо прежних 30 секунд. Платформа также будет автоматически повторять неудавшиеся запросы, когда это безопасно. Публичные API должны жить на Worker, а Durable Objects — за ними. Hyperdrive может пулить существующие соединения Postgres или MySQL. Он не измерял, ниже ли задержка при вызове моделей, размещённых на Cloudflare, из Durable Object, и не стал этого обещать.","children":[]}]}]},{"id":"talk-10","type":"talk","en":"Ferrisway: Ramp's global routing layer on Cloudflare","ru":"Ferrisway: глобальный слой маршрутизации Ramp на Cloudflare","speakerEn":"A production-engineering lead at Ramp. The transcript does not give a personal name. The speaker had been there a little more than a year and a half. Ramp aims to be a financial operating system for companies; he said customers save about 7.5% in the first year.","speakerRu":"Ведущий инженер по production-инженерии в Ramp. Транскрипт не называет личного имени. Спикер работал там чуть больше полутора лет. Ramp стремится быть финансовой операционной системой для компаний; он сказал, что клиенты экономят около 7,5% в первый год.","url":"https://www.youtube.com/watch?v=yeREKpfvuK4","accent":9,"children":[{"id":"talk-10-intro","type":"intro","en":"Ramp is splitting its old monolith into isolated “cells,” and Ferrisway — a Rust WebAssembly Worker at the edge — now routes about half a billion requests a day to the right cell, while a Go service called Go There remains the single source of truth.","ru":"Ramp разделяет свой старый монолит на изолированные «ячейки» (cells), и Ferrisway — Worker на Rust и WebAssembly на edge — теперь направляет около полумиллиарда запросов в день в нужную ячейку, в то время как сервис на Go под названием Go There остаётся единственным источником истины.","children":[]},{"id":"talk-10-sec-1","type":"section","en":"Why cells","ru":"Зачем ячейки (cells)","children":[{"id":"talk-10-sec-1-item-1","type":"item","en":"Growth had packed one load balancer, a largely monolithic app and one huge database. Cells give them room to scale, fault isolation so a bad deploy need not hit 100% of customers, and a path to data residency as they expand, including into Europe. Routing has to stay invisible, so customers keep one URL and Ramp can move them without asking them to change address.","ru":"Рост уплотнил один балансировщик нагрузки, в основном монолитное приложение и одну огромную базу данных. Ячейки дают запас по масштабированию, изоляцию отказов, чтобы неудачный деплой не задел 100% клиентов, и путь к резидентности данных по мере расширения, в том числе в Европу. Маршрутизация должна оставаться невидимой, чтобы у клиентов был один URL, а Ramp мог их перемещать, не прося сменить адрес.","children":[]},{"id":"talk-10-sec-1-item-2","type":"item","en":"They have to route uncontrolled webhooks and bank payloads; web and mobile apps, where they can add headers; developer APIs that must keep working unchanged; credit-card authorizations, which cannot afford extra latency; and growing agent and MCP traffic, sometimes across businesses.","ru":"Им приходится маршрутизировать неконтролируемые webhooks и банковские полезные нагрузки; веб- и мобильные приложения, куда они могут добавлять заголовки; API для разработчиков, которые должны продолжать работать без изменений; авторизации по кредитным картам, которые не могут себе позволить дополнительную задержку; и растущий трафик агентов и MCP, иногда между компаниями.","children":[]}]},{"id":"talk-10-sec-2","type":"section","en":"Ferrisway and Go There","ru":"Ferrisway и Go There","children":[{"id":"talk-10-sec-2-item-1","type":"item","en":"Go There is a Go service — the name is a pun on “go there” and the gopher — that stores routing keys and cell mappings in DynamoDB. Ferrisway has been in production since January 2026, took only a few weeks to reach 100% of traffic, and is a Cloudflare Worker written in Rust and compiled to WebAssembly. It handles about half a billion requests daily, more than 5,000 requests per second on average, and about 10 TB of traffic a day.","ru":"Go There — сервис на Go; название — каламбур на «go there» и сурка-gopher. Он хранит ключи маршрутизации и соответствия ячеек в DynamoDB. Ferrisway в продакшене с января 2026 года, за всего несколько недель вышел на 100% трафика и представляет собой Cloudflare Worker, написанный на Rust и скомпилированный в WebAssembly. Он обрабатывает около полумиллиарда запросов ежедневно, в среднем более 5000 запросов в секунду и около 10 ТБ трафика в день.","children":[]},{"id":"talk-10-sec-2-item-2","type":"item","en":"They extract a routing key from a header, path, query string, JWT, or, most expensively, the body. They have on the order of 100 routing rules — later he said perhaps 100 to 200 — but one major header rule already used by internal apps covers about 90% of cases. Both services share the same YAML rules; Ferrisway compiles them into Rust at build time so Workers start fast. Ferrisway only buffers a tight amount of body data, after out-of-memory errors when concurrent heavy webhooks shared a Worker. Anything it cannot parse goes to Go There.","ru":"Они извлекают ключ маршрутизации из заголовка, пути, строки запроса, JWT или, что дороже всего, из тела. У них порядка 100 правил маршрутизации — позже он сказал, возможно, от 100 до 200, — но одно основное правило по заголовку, уже используемое внутренними приложениями, покрывает около 90% случаев. Оба сервиса используют одни и те же правила на YAML; Ferrisway компилирует их в Rust на этапе сборки, чтобы Workers стартовали быстро. Ferrisway буферизует лишь ограниченный объём данных тела после ошибок нехватки памяти, когда одновременные тяжёлые webhooks делили один Worker. Всё, что он не может разобрать, уходит в Go There.","children":[]}]},{"id":"talk-10-sec-3","type":"section","en":"Caching, operations, and Q&A","ru":"Кэширование, эксплуатация и вопросы и ответы","children":[{"id":"talk-10-sec-3-item-1","type":"item","en":"Three cache layers, none of them the source of truth: isolate memory with a tiny LRU, answering in under 10 nanoseconds; the Cache API in the point of presence, around 10 milliseconds; then Workers KV, around 100 milliseconds. On a stale-but-valid hit it routes immediately and refreshes in the background. Default expiry was 24 hours; freshness was about five minutes in the discussion. A tail Worker turns logs into traces. Deploys use a 0% canary with a special header, then promotion once checks pass.","ru":"Три слоя кэша, ни один не является источником истины: память изолята с крошечным LRU, отвечающая быстрее 10 наносекунд; Cache API в точке присутствия, около 10 миллисекунд; затем Workers KV, около 100 миллисекунд. При устаревшем, но ещё действительном попадании он маршрутизирует сразу и обновляет кэш в фоне. Срок по умолчанию был 24 часа; актуальность в обсуждении составляла около пяти минут. Tail Worker превращает логи в трейсы. Деплои используют канарейку на 0% со специальным заголовком, затем продвижение после прохождения проверок.","children":[]},{"id":"talk-10-sec-3-item-2","type":"item","en":"They chose Rust over Go compiled to Wasm because the Go path produced a bloated Worker, and over JavaScript for start time and compile-time checks. The routing core has been stable since January. His team owns rule changes and rolls them through a heavily used QA environment first.","ru":"Они выбрали Rust, а не Go, скомпилированный в Wasm, потому что путь через Go давал раздутый Worker, и предпочли его JavaScript из-за времени старта и проверок на этапе компиляции. Ядро маршрутизации стабильно с января. Его команда владеет изменениями правил и сначала прогоняет их через активно используемое QA-окружение.","children":[]}]}]},{"id":"talk-11","type":"talk","en":"Building durable agents with Durable Objects","ru":"Создаём устойчивых агентов с помощью Durable Objects","speakerEn":"Justin, who runs two companies, Braid and Standard Agents, and is based in Virginia. Braid is a client-services firm that used to build ordinary apps and websites. In the Q&A he is addressed as Justin.","speakerRu":"Justin, который руководит двумя компаниями, Braid и Standard Agents, и живёт в Вирджинии. Braid — клиентская сервисная компания, которая раньше делала обычные приложения и сайты. В сессии вопросов и ответов его называют Justin.","url":"https://www.youtube.com/watch?v=VBsqp3NutAE","accent":10,"children":[{"id":"talk-11-intro","type":"intro","en":"Customers now ask for custom agents that run all the time, with prompts such as “follow up with every lead.” He argues Durable Objects are the right primitive: each conversation thread gets its own isolated compute, SQLite database and scheduler, without a virtual server per customer.","ru":"Клиенты теперь просят заказных агентов, которые работают постоянно, с запросами вроде «сопроводи каждый лид». Он утверждает, что Durable Objects — правильный примитив: каждый тред разговора получает собственные изолированные вычисления, базу SQLite и планировщик, без виртуального сервера на каждого клиента.","children":[]},{"id":"talk-11-sec-1","type":"section","en":"What an agent needs","ru":"Что нужно агенту","children":[{"id":"talk-11-sec-1-item-1","type":"item","en":"He defined an agent as “deterministic software that harnesses the non-deterministic results produced by models in pursuit of a desired objective.” In practice you also need thread state, isolation, hooks, step limits, and often a filesystem and code execution. He does not think a single giant model plus an MCP server will replace domain-specific agents. Small models can do small, focused jobs.","ru":"Он определил агента как «детерминированное ПО, которое использует недетерминированные результаты моделей для достижения желаемой цели». На практике также нужны состояние треда, изоляция, хуки, лимиты шагов и часто файловая система и выполнение кода. Он не считает, что одна гигантская модель плюс MCP-сервер заменят предметных агентов. Небольшие модели могут выполнять небольшие, узкие задачи.","children":[]},{"id":"talk-11-sec-1-item-2","type":"item","en":"A shared virtual server is an isolation risk, and one server per customer does not scale. Agents need no painful cold start, consistent writes so history can be reread after every tool call, and a way to wake up with no inbound request, for example “tomorrow at 9 a.m.” Replaying full history on every step is an O(n²) read problem, so each thread needs its own ACID database.","ru":"Общий виртуальный сервер — риск для изоляции, а один сервер на клиента не масштабируется. Агентам нужен безболезненный холодный старт, согласованные записи, чтобы историю можно было перечитать после каждого вызова инструмента, и способ просыпаться без входящего запроса, например «завтра в 9:00». Полный повтор истории на каждом шаге — это задача чтения сложности O(n²), поэтому каждому треду нужна собственная база с ACID.","children":[]}]},{"id":"talk-11-sec-2","type":"section","en":"How Durable Objects map, and a demo","ru":"Как на это ложатся Durable Objects, и демо","children":[{"id":"talk-11-sec-2-item-1","type":"item","en":"A Durable Object is a tiny server on a Worker: its own code, a SQLite database up to 10 GB, and HTTP or WebSockets, with 128 MB of memory and no filesystem — they treat the database as files. Workers for Platforms can isolate one customer from another. Cold start is usually about 200 milliseconds. Generated code can run in a dynamic Worker with no network unless you grant it. A Durable Object can hold only one alarm, so they keep a queue in SQLite and set the next alarm each time it fires.","ru":"Durable Object — крошечный сервер на Worker: собственный код, база SQLite до 10 ГБ и HTTP или WebSockets, с 128 МБ памяти и без файловой системы — они трактуют базу как файлы. Workers for Platforms могут изолировать одного клиента от другого. Холодный старт обычно около 200 миллисекунд. Сгенерированный код может работать в динамическом Worker без сети, пока вы её не разрешите. У Durable Object может быть только один alarm, поэтому они держат очередь в SQLite и ставят следующий alarm каждый раз, когда срабатывает текущий.","children":[]},{"id":"talk-11-sec-2-item-2","type":"item","en":"Attendees each got their own expense-report agent. He said 667 people had already created one, and that 89 reports had cost 19 cents in total because they could use a small model, Luna, for such a narrow task. Three collaborating agents — an accounting coordinator, the user’s helper, and a Google Sheets specialist — are each Durable Objects. The demo took less than an hour to build on their Standard Agents framework.","ru":"Каждый участник получил собственного агента для авансовых отчётов. Он сказал, что 667 человек уже создали такого, и что 89 отчётов обошлись в общей сложности в 19 центов, потому что для такой узкой задачи можно было использовать небольшую модель Luna. Три сотрудничающих агента — координатор бухгалтерии, помощник пользователя и специалист по Google Sheets — каждый является Durable Object. Демо собрали меньше чем за час на их фреймворке Standard Agents.","children":[]}]},{"id":"talk-11-sec-3","type":"section","en":"Practical tips and Q&A","ru":"Практические советы и вопросы и ответы","children":[{"id":"talk-11-sec-3-item-1","type":"item","en":"Keep fallback models, and on failure move from a cheap specialist model to a stronger general one, preferably on another provider. To keep a long run alive, set a short alarm rather than tying work only to the inbound HTTP request; he warned that alarms can loop. Set the next alarm before executing the current job. Objects can die mid-run, especially on a deploy — he gave 0.325% in production — so they use a watchdog Durable Object. They often have 20,000 to 50,000 objects running.","ru":"Держите fallback-модели и при сбое переходите с дешёвой специализированной модели на более сильную общую, желательно у другого провайдера. Чтобы долгоживущий процесс не умирал, ставьте короткий alarm, а не привязывайте работу только к входящему HTTP-запросу; он предупредил, что alarms могут зациклиться. Ставьте следующий alarm до выполнения текущей задачи. Объекты могут умереть посреди работы, особенно при деплое — он назвал цифру 0,325% в продакшене, — поэтому они используют сторожевой Durable Object. Часто у них одновременно работают от 20 000 до 50 000 объектов.","children":[]},{"id":"talk-11-sec-3-item-2","type":"item","en":"Multiple chats are multiple instances of the same “recipe,” like threads in a sidebar. For parent and child agents he prefers plain language over a rigid schema. To stay inside 128 MB, stream everything and split files into 2 MB SQLite rows. Their platform uses Workers, Workers for Platforms, Workers AI, D1, R2, KV, Queues and Artifacts.","ru":"Несколько чатов — это несколько экземпляров одного и того же «рецепта», как треды в боковой панели. Для родительских и дочерних агентов он предпочитает обычный язык жёсткой схеме. Чтобы уложиться в 128 МБ, стримьте всё и дробите файлы на строки SQLite по 2 МБ. Их платформа использует Workers, Workers for Platforms, Workers AI, D1, R2, KV, Queues и Artifacts.","children":[]}]}]},{"id":"talk-12","type":"talk","en":"12 mistakes TELUS made building an agent platform for 100,000 employees","ru":"12 ошибок, которые TELUS допустили, строя платформу агентов для 100 000 сотрудников","speakerEn":"Kevin, who does developer advocacy at TELUS, and Andrew, a software engineer there, introduced by their colleague Justin. Later, distinguished engineer Justin Watts appears as “chief refactor officer.” TELUS is a Canadian company with more than 100,000 people in over 45 countries, across telecom, health, farming and digital services, and about 30 ways for staff to sign in.","speakerRu":"Kevin, который занимается developer advocacy в TELUS, и Andrew, инженер-программист там, представленные коллегой Justin. Позже distinguished engineer Justin Watts появляется как «chief refactor officer». TELUS — канадская компания с более чем 100 000 человек в более чем 45 странах, в телекоме, здравоохранении, сельском хозяйстве и цифровых сервисах, и примерно с 30 способами входа для сотрудников.","url":"https://www.youtube.com/watch?v=9DGeQ6AeL5o","accent":11,"children":[{"id":"talk-12-intro","type":"intro","en":"They built Gizmos, a company-wide sandbox on Cloudflare dynamic Workers, so anyone at TELUS can ship an internal app or agent without a long “last mile” of tickets. In six months they made, and fixed, 12 platform mistakes, which are the subject of the talk.","ru":"Они построили Gizmos, общекорпоративную песочницу на динамических Workers Cloudflare, чтобы любой сотрудник TELUS мог выпустить внутреннее приложение или агента без длинной «последней мили» из тикетов. За шесть месяцев они совершили и исправили 12 платформенных ошибок, которым и посвящён доклад.","children":[]},{"id":"talk-12-sec-1","type":"section","en":"The problem","ru":"Проблема","children":[{"id":"talk-12-sec-1-item-1","type":"item","en":"Building a prototype is now an afternoon. Sharing it used to mean a nine-step internal guide plus a 20-minute video covering GCP, Kubernetes, Terraform and Helm, and it still ended only in a dev environment. Many first-time builders never finished. Gizmos stands up single sign-on, access control and sharing, offers on-demand databases and KV, and is meant to work with many agents. The public site is gizmos.run; they warned there may be a waitlist.","ru":"Собрать прототип теперь можно за полдень. Поделиться им раньше означало девятишаговую внутреннюю инструкцию плюс 20-минутное видео про GCP, Kubernetes, Terraform и Helm, и всё равно это заканчивалось только в dev-окружении. Многие, кто строил впервые, так и не доходили до конца. Gizmos поднимает единый вход, контроль доступа и шаринг, даёт базы данных и KV по требованию и задуман так, чтобы работать со многими агентами. Публичный сайт — gizmos.run; они предупредили, что может быть лист ожидания.","children":[]}]},{"id":"talk-12-sec-2","type":"section","en":"The 12 mistakes","ru":"12 ошибок","children":[{"id":"talk-12-sec-2-item-1","type":"item","en":"**Treating a zip upload as “easy.”** New users got stuck, and agents built things the uploader could not deploy. They added an `llms.txt` and Gizmos Studio: OpenCode in a Cloudflare container, one per person. Watch someone try it before you call it easy.","ru":"**Считать загрузку zip «лёгкой».** Новые пользователи застревали, а агенты собирали то, что загружающий не мог задеплоить. Они добавили `llms.txt` и Gizmos Studio: OpenCode в контейнере Cloudflare, по одному на человека. Посмотрите, как кто-то пробует это, прежде чем называть это лёгким.","children":[],"n":1},{"id":"talk-12-sec-2-item-2","type":"item","en":"**No metering, limits or billing at first.** People ran expensive jobs such as OCR at huge volume. They added controls after a painful bill.","ru":"**Сначала не было учёта, лимитов и биллинга.** Люди запускали дорогие задачи вроде OCR в огромных объёмах. Контроль они добавили после болезненного счёта.","children":[],"n":2},{"id":"talk-12-sec-2-item-3","type":"item","en":"**One “Sign in with Google” button.** Some units are not on Google, and there were more than a dozen domains Kevin did not know existed. They rebuilt sign-in with Better Auth: type your email, then passkey, Google, or a magic link from a Worker.","ru":"**Одна кнопка «Sign in with Google».** Некоторые подразделения не на Google, и существовало больше дюжины доменов, о которых Kevin не знал. Они пересобрали вход с Better Auth: вводите email, затем passkey, Google или magic link от Worker.","children":[],"n":3},{"id":"talk-12-sec-2-item-4","type":"item","en":"**Scalability bolted on late.** Demos with thousands of people joining at once exposed the gaps.","ru":"**Масштабируемость, прикрученная поздно.** Демо, на которые сразу заходили тысячи людей, обнажили пробелы.","children":[],"n":4},{"id":"talk-12-sec-2-item-5","type":"item","en":"**Analytics stuffed into the main D1.** They were still under 1% of D1’s 10 GB cap, but almost half the rows were events. After moving events to Analytics Engine, sampling broke unique-people counts; once that was fixed, usage appeared about seven times higher. They now see about 10,000 people a month. The database is about 7% full, mostly every app version ever shipped.","ru":"**Аналитика, запиханная в основной D1.** Они всё ещё были ниже 1% от лимита D1 в 10 ГБ, но почти половина строк была событиями. После переноса событий в Analytics Engine выборка сломала подсчёт уникальных людей; когда это исправили, использование оказалось примерно в семь раз выше. Сейчас они видят около 10 000 человек в месяц. База заполнена примерно на 7%, в основном всеми когда-либо выпущенными версиями приложений.","children":[],"n":5},{"id":"talk-12-sec-2-item-6","type":"item","en":"**Community marketplaces fill with unused to-do apps.** They now feature organization-wide apps, and are adding teams, stars and usage.","ru":"**Общественные маркетплейсы заполняются неиспользуемыми to-do приложениями.** Теперь они выделяют общеорганизационные приложения и добавляют команды, звёзды и данные об использовании.","children":[],"n":6},{"id":"talk-12-sec-2-item-7","type":"item","en":"**No observability, then a self-inflicted outage.** For about five weeks users reported errors in Slack. Adding tracing wrongly made every outbound call return HTTP 500. In June they shipped a status page on its own Worker, polled every five minutes.","ru":"**Сначала не было наблюдаемости, затем самодельный сбой.** Около пяти недель пользователи сообщали об ошибках в Slack. Добавление трассировки по ошибке заставило каждый исходящий вызов возвращать HTTP 500. В июне они выпустили страницу статуса на отдельном Worker, опрашиваемую каждые пять минут.","children":[],"n":7},{"id":"talk-12-sec-2-item-8","type":"item","en":"**Chasing every new framework.** Andrew’s note to himself: do not rewrite the project for the tenth time.","ru":"**Погоня за каждым новым фреймворком.** Заметка Andrew самому себе: не переписывать проект в десятый раз.","children":[],"n":8},{"id":"talk-12-sec-2-item-9","type":"item","en":"**Assuming everyone lives in Claude Code and a terminal.** In August they shipped a Gizmos MCP connector inside Claude, with no terminal or install.","ru":"**Предположение, что все живут в Claude Code и терминале.** В августе они выпустили коннектор Gizmos MCP внутри Claude, без терминала и установки.","children":[],"n":9},{"id":"talk-12-sec-2-item-10","type":"item","en":"**Building one platform to replace all the others.** They still want Gizmos to support other platforms, and joked about a “Gizmos 2” in 2027 if they are not careful.","ru":"**Строить одну платформу, которая заменит все остальные.** Они по-прежнему хотят, чтобы Gizmos поддерживал другие платформы, и шутили про «Gizmos 2» в 2027 году, если не будут осторожны.","children":[],"n":10},{"id":"talk-12-sec-2-item-11","type":"item","en":"**Vibe-coding bloat.** Nothing was written by hand. Two busy days in August saw 157 commits, with three ways to do the same thing. Justin Watts turned three approaches into one, removed 18,000 lines of comments in a day, and deleted almost 100,000 lines. They still vibe-code everything, but now book the refactor first.","ru":"**Раздувание от vibe-coding.** Ничего не было написано руками. За два загруженных дня в августе было 157 коммитов и три способа сделать одно и то же. Justin Watts свёл три подхода к одному, за день убрал 18 000 строк комментариев и удалил почти 100 000 строк. Они по-прежнему всё vibe-кодят, но теперь сначала бронируют рефакторинг.","children":[],"n":11},{"id":"talk-12-sec-2-item-12","type":"item","en":"**Getting lost in the vibes.** Both wrote this one down independently. If you only specify the outcome, you cannot validate the result.","ru":"**Потеряться в vibes.** Оба независимо записали этот пункт. Если вы задаёте только результат, вы не можете проверить, что получилось.","children":[],"n":12}]},{"id":"talk-12-sec-3","type":"section","en":"Results and Q&A","ru":"Результаты и вопросы и ответы","children":[{"id":"talk-12-sec-3-item-1","type":"item","en":"All 12 mistakes happened and were fixed in about six months. 15,000 people have used Gizmos, about 15% of the company, and the previous month had nearly half a million views. Unusual builders include store managers in Nova Scotia and sales teams running “agent farms.” Isolate compute has been “pocket change”; they focus billing on AI usage. They still tell staff not to put highly sensitive data in Gizmos yet, and scan each push for secrets.","ru":"Все 12 ошибок произошли и были исправлены примерно за шесть месяцев. Gizmos использовали 15 000 человек, около 15% компании, а в предыдущем месяце было почти полмиллиона просмотров. Среди необычных авторов — управляющие магазинами в Nova Scotia и отделы продаж, запускающие «фермы агентов». Вычисления в изолятах обошлись «в копейки»; биллинг они сосредотачивают на использовании ИИ. Сотрудникам они по-прежнему говорят пока не класть в Gizmos особо чувствительные данные и сканируют каждый push на секреты.","children":[]}]}]},{"id":"talk-13","type":"talk","en":"Artifacts: Git-compatible versioned storage, from zero to beta in 3 weeks - by Dillon Mulroy","ru":"Artifacts: версионированное хранилище, совместимое с Git, от нуля до беты за 3 недели — Dillon Mulroy","speakerEn":"Dillon Mulroy, who had been on Cloudflare’s dashboard-agent team working on Agently before being pulled onto this project.","speakerRu":"Dillon Mulroy, который был в команде dashboard-агента Cloudflare и работал над Agently, прежде чем его привлекли к этому проекту.","url":"https://www.youtube.com/watch?v=D_tnYlZe5t8","accent":12,"children":[{"id":"talk-13-intro","type":"intro","en":"A three-person team took Artifacts — Git-compatible versioned storage on the edge, built entirely by coding agents — from nothing to closed beta in three weeks, including a customer requirement of 1,000 new repositories per second in one namespace, which they met.","ru":"Команда из трёх человек довела Artifacts — версионированное хранилище, совместимое с Git, на edge, целиком созданное кодирующими агентами, — от нуля до закрытой беты за три недели, включая требование клиента в 1000 новых репозиториев в секунду в одном пространстве имён, которое они выполнили.","children":[]},{"id":"talk-13-sec-1","type":"section","en":"Why now, and how it is built","ru":"Почему сейчас и как это устроено","children":[{"id":"talk-13-sec-1-item-1","type":"item","en":"A large multi-tenant customer needed Git storage at the edge, especially small repositories that agents can work on quickly. They chose Git because it is in model training data, every developer already has a client, and it works as general versioned storage, not only for code. They had three weeks until Agents Week for a closed beta, and four weeks until the customer’s own closed beta.","ru":"Крупному мультитенантному клиенту нужно было Git-хранилище на edge, особенно небольшие репозитории, с которыми агенты могут быстро работать. Они выбрали Git, потому что он есть в данных для обучения моделей, у каждого разработчика уже есть клиент, и он подходит как общее версионированное хранилище, а не только для кода. До закрытой беты к Agents Week у них было три недели, и четыре недели до собственной закрытой беты клиента.","children":[]},{"id":"talk-13-sec-1-item-2","type":"item","en":"Matt Carey worked on the Git engine, after a winter break spent on a Zig and WebAssembly implementation. Thomas Ancorn, from observability, helped line up process and teams. Dillon worked on the control plane and developer experience.","ru":"Matt Carey работал над Git-движком после зимних каникул, посвящённых реализации на Zig и WebAssembly. Thomas Ancorn из наблюдаемости помог выстроить процесс и взаимодействие команд. Dillon занимался control plane и опытом разработчика.","children":[]},{"id":"talk-13-sec-1-item-3","type":"item","en":"Almost everything is Durable Objects: an account namespace index; sharded registry objects that list repositories; a token manager per repository; and the Git server itself. Design rules: never lose or corrupt Git data; stream, never buffer, because of the 128 MB isolate limit; and never put a single object on the hot path. On create, the name is hashed to one of four registry shards, for a theoretical peak of about 4,000 creates per second. A brand-new repository may not show up in a list immediately. Bytes stream to the Git server in 2 MB SQLite chunks, compressed with zstd. A push first lands in a quarantine table, then is copied into the main tables in one transaction. Repositories are currently capped at about 10 GB. They hope to support Git LFS later.","ru":"Почти всё — это Durable Objects: индекс пространства имён аккаунта; шардированные объекты реестра, которые перечисляют репозитории; менеджер токенов на каждый репозиторий; и сам Git-сервер. Правила дизайна: никогда не терять и не портить данные Git; стримить, никогда не буферизовать, из-за лимита изолята в 128 МБ; и никогда не ставить один объект на горячий путь. При создании имя хешируется в один из четырёх шардов реестра, что даёт теоретический пик около 4000 созданий в секунду. Совсем новый репозиторий может сразу не появиться в списке. Байты стримятся на Git-сервер чанками SQLite по 2 МБ, сжатыми zstd. Push сначала попадает в карантинную таблицу, затем копируется в основные таблицы в одной транзакции. Репозитории сейчас ограничены примерно 10 ГБ. Позже они надеются поддержать Git LFS.","children":[]}]},{"id":"talk-13-sec-2","type":"section","en":"The rewrite, a naming bug, and lessons","ru":"Переписывание, ошибка в именах и уроки","children":[{"id":"talk-13-sec-2-item-1","type":"item","en":"The original Zig and Wasm engine was about 100 KB, but copying across the Wasm boundary burned CPU and memory as they grew toward about 10 million repositories, and later toward or past 20 million. They chose a JavaScript rewrite, led with agents by principal engineer Michael Hart, and ran it against Git conformance tests. On a large workerd repository, peak memory fell from 359 MB to 40 MB. Pushing to an empty Artifacts repository went from 54 seconds to 27 seconds, and cloning from 17 seconds to 8 seconds. His manager, Steve, joked that language does not matter and rewriting does — a view Dillon now takes seriously if you have the token budget.","ru":"Изначальный движок на Zig и Wasm весил около 100 КБ, но копирование через границу Wasm сжигало CPU и память, когда они выросли примерно до 10 миллионов репозиториев, а затем к 20 миллионам или больше. Они выбрали переписывание на JavaScript под руководством агентов и principal engineer Michael Hart и прогнали его через тесты соответствия Git. На большом репозитории workerd пиковая память упала с 359 МБ до 40 МБ. Push в пустой репозиторий Artifacts ускорился с 54 секунд до 27, а клонирование — с 17 секунд до 8. Его руководитель, Steve, пошутил, что язык не важен, а важно переписывание — взгляд, который Dillon теперь принимает всерьёз, если есть бюджет токенов.","children":[]},{"id":"talk-13-sec-2-item-2","type":"item","en":"He forgot to lowercase repository names, so two names that differed only by case could map to different Durable Objects. Older agents could not fix it without version skew. A later model then one-shotted the change; the auto-transcript sounds like “Fable 51,” which may be a mis-hearing of a model name.","ru":"Он забыл приводить имена репозиториев к нижнему регистру, поэтому два имени, отличавшиеся только регистром, могли попадать в разные Durable Objects. Более старые агенты не могли это исправить без расхождения версий. Более поздняя модель затем внесла изменение за один проход (one-shot); в автотранскрипте звучит как «Fable 51», что может быть ослышкой названия модели.","children":[]},{"id":"talk-13-sec-2-item-3","type":"item","en":"He believes Artifacts was the first Cloudflare product written entirely by agents, by a team of three in three weeks, with no hand-written code. They still read every line, though they correct less now, and review itself is becoming the bottleneck. In the short Q&A, he did not think Artifacts was used inside a core “Cloudflare OS” product, but said a binding would be enough. On the idea that writing code by hand is dying, he said there will be more software, and it still needs people who have shipped bugs; he worries about how to onboard new developers, and had no neat answer.","ru":"Он считает, что Artifacts стал первым продуктом Cloudflare, целиком написанным агентами, командой из трёх человек за три недели, без кода, написанного руками. Они по-прежнему читают каждую строку, хотя правят уже меньше, и само ревью становится узким местом. В короткой сессии вопросов и ответов он не считал, что Artifacts используется внутри ключевого продукта «Cloudflare OS», но сказал, что хватило бы binding. На мысль о том, что ручное написание кода умирает, он ответил, что программного обеспечения станет больше, и ему по-прежнему нужны люди, которые уже выпускали баги; его беспокоит, как вводить в профессию новых разработчиков, и готового ответа у него не было.","children":[]}]}]}]};
</script>
<script>
(function () {
  "use strict";

  var STORAGE = {
    lang: "cf-connect-2026-lang",
    theme: "cf-connect-2026-theme",
    open: "cf-connect-2026-open"
  };

  var lang = document.documentElement.lang === "ru" ? "ru" : "en";
  var theme = document.documentElement.getAttribute("data-theme") || "light";
  var openSet = new Set();
  var savedOpenBeforeSearch = null;
  var query = "";
  var nodesById = {};
  var visibleIds = [];

  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function loadStore() {
    try {
      var storedLang = localStorage.getItem(STORAGE.lang);
      if (storedLang === "en" || storedLang === "ru") lang = storedLang;
    } catch (e) {}
    try {
      var storedTheme = localStorage.getItem(STORAGE.theme);
      if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
      else theme = prefersDark() ? "dark" : "light";
    } catch (e) {
      theme = prefersDark() ? "dark" : "light";
    }
    try {
      var raw = localStorage.getItem(STORAGE.open);
      if (raw) {
        JSON.parse(raw).forEach(function (id) { openSet.add(id); });
      }
    } catch (e) {}
  }

  function saveOpen() {
    try { localStorage.setItem(STORAGE.open, JSON.stringify(Array.from(openSet))); } catch (e) {}
  }
  function saveLang() {
    try { localStorage.setItem(STORAGE.lang, lang); } catch (e) {}
  }
  function saveTheme() {
    try { localStorage.setItem(STORAGE.theme, theme); } catch (e) {}
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      var label = theme === "dark" ? t("themeToLight") : t("themeToDark");
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label);
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("pageTitle");
    var map = {
      "brand-title": "brand",
      "brand-sub": "subtitle",
      "btn-expand": "expandAll",
      "btn-collapse": "collapseAll",
      "skip-link": "skipToTree",
      "no-results": "noMatches"
    };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = t(map[id]);
    });
    var search = document.getElementById("search");
    if (search) search.setAttribute("placeholder", t("searchPlaceholder"));
    var clear = document.getElementById("search-clear");
    if (clear) clear.setAttribute("aria-label", t("searchClear"));
    document.querySelectorAll(".yt-link").forEach(function (a) {
      a.setAttribute("aria-label", t("watchOnYoutube"));
      var label = a.querySelector(".yt-label");
      if (label) label.textContent = t("youtube");
    });
    document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    document.getElementById("btn-ru").setAttribute("aria-pressed", lang === "ru" ? "true" : "false");
    document.getElementById("btn-en").setAttribute("aria-label", t("langSwitchToEn"));
    document.getElementById("btn-ru").setAttribute("aria-label", t("langSwitchToRu"));
    var tree = document.getElementById("tree");
    if (tree) tree.setAttribute("aria-label", t("treeLabel"));
    applyTheme();
    updateSearchMeta();
  }

  function t(key) {
    var pack = UI[lang] || UI.en;
    return pack[key] || UI.en[key] || key;
  }

  function formatMatchCount(n) {
    if (lang === "en") return n === 1 ? "1 match" : n + " matches";
    var mod10 = n % 10, mod100 = n % 100, word = "совпадений";
    if (mod10 === 1 && mod100 !== 11) word = "совпадение";
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = "совпадения";
    return n + " " + word;
  }


  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatText(s) {
    var html = escapeHtml(s);
    html = html.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, function (_, text, url) {
      return '<a href="' + url.replace(/"/g, "") + '" target="_blank" rel="noopener noreferrer">' + text + "</a>";
    });
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return html;
  }

  function langBlock(en, ru, className) {
    return (
      '<span class="lang-en' + (className ? " " + className : "") + '">' + formatText(en) + "</span>" +
      '<span class="lang-ru' + (className ? " " + className : "") + '">' + formatText(ru) + "</span>"
    );
  }

  function defaultOpen() {
    openSet = new Set(["root"]);
  }

  function isOpen(id) {
    return openSet.has(id);
  }

  function chevronSvg() {
    return '<svg class="chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7.4 4.8a1 1 0 0 1 1.4.05l5 5.2a1 1 0 0 1 0 1.4l-5 5.2a1 1 0 1 1-1.45-1.38L11.6 10 7.35 6.18A1 1 0 0 1 7.4 4.8z"/></svg>';
  }

  function renderNode(node, depth) {
    nodesById[node.id] = node;
    var hasChildren = !!(node.children && node.children.length);
    var classes = ["node", node.type || "item"];
    if (hasChildren) classes.push("has-children");
    else classes.push("leaf");
    if (hasChildren && isOpen(node.id)) classes.push("open");
    var acc = node.accent != null ? ' data-accent="' + node.accent + '"' : "";
    var html = '<li class="' + classes.join(" ") + '" id="node-' + node.id + '" role="treeitem" data-id="' + node.id + '"' + acc;
    html += ' aria-level="' + depth + '"';
    if (hasChildren) html += ' aria-expanded="' + (isOpen(node.id) ? "true" : "false") + '"';
    html += ' tabindex="-1">';
    html += '<div class="row">';
    html += chevronSvg();
    html += '<div class="row-body">';
    if (node.type === "item" && node.n) {
      html += '<span class="row-title"><span class="item-num">' + node.n + ".</span> " + langBlock(node.en, node.ru) + "</span>";
    } else {
      html += '<span class="row-title">' + langBlock(node.en, node.ru) + "</span>";
    }
    if (node.speakerEn) {
      html += '<span class="speaker">' + langBlock(node.speakerEn, node.speakerRu) + "</span>";
    }
    html += "</div>";
    if (node.url) {
      html += '<a class="yt-link" href="' + escapeHtml(node.url) + '" target="_blank" rel="noopener noreferrer" tabindex="0">';
      html += '<span class="yt-label">' + escapeHtml(UI[lang].youtube) + "</span> ↗</a>";
    }
    if (node.links && node.links.length) {
      node.links.forEach(function (link) {
        html += '<a class="page-link" href="' + escapeHtml(link.href) + '">';
        html += langBlock(link.en, link.ru);
        html += "</a>";
      });
    }
    html += "</div>";
    if (hasChildren) {
      html += '<div class="children" role="group"><div class="children-inner"><ul>';
      node.children.forEach(function (child) {
        html += renderNode(child, depth + 1);
      });
      html += "</ul></div></div>";
    }
    html += "</li>";
    return html;
  }

  function mountTree() {
    nodesById = {};
    if (openSet.size === 0) defaultOpen();
    var tree = document.getElementById("tree");
    tree.innerHTML = renderNode(TREE, 1);
    tree.setAttribute("role", "tree");
    refreshVisible();
    var first = tree.querySelector(".node");
    if (first) first.tabIndex = 0;
  }

  function setOpen(id, open, persist) {
    var el = document.getElementById("node-" + id);
    var node = nodesById[id];
    if (!node || !node.children || !node.children.length) return;
    if (open) openSet.add(id);
    else openSet.delete(id);
    if (el) {
      el.classList.toggle("open", open);
      el.setAttribute("aria-expanded", open ? "true" : "false");
    }
    if (persist !== false && !query) saveOpen();
  }

  function toggle(id) {
    setOpen(id, !isOpen(id));
  }

  function expandAll() {
    Object.keys(nodesById).forEach(function (id) {
      var n = nodesById[id];
      if (n.children && n.children.length) setOpen(id, true, false);
    });
    if (!query) saveOpen();
  }

  function collapseAll() {
    Object.keys(nodesById).forEach(function (id) {
      if (id === "root") setOpen(id, true, false);
      else setOpen(id, false, false);
    });
    if (!query) saveOpen();
  }

  function ancestorsOf(id) {
    var ids = [];
    var el = document.getElementById("node-" + id);
    if (!el) return ids;
    var parent = el.parentElement && el.parentElement.closest(".node");
    while (parent) {
      ids.push(parent.getAttribute("data-id"));
      parent = parent.parentElement && parent.parentElement.closest(".node");
    }
    return ids;
  }

  function nodeSearchText(node) {
    var parts = [node[lang] || ""];
    if (lang === "en" && node.speakerEn) parts.push(node.speakerEn);
    if (lang === "ru" && node.speakerRu) parts.push(node.speakerRu);
    return parts.join(" ");
  }

  function clearMarks(root) {
    root.querySelectorAll("mark").forEach(function (m) {
      var p = m.parentNode;
      p.replaceChild(document.createTextNode(m.textContent), m);
      p.normalize();
    });
  }

  function highlightIn(el, q) {
    if (!q || !el) return;
    var lower = q.toLowerCase();
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (textNode) {
      var raw = textNode.nodeValue;
      var idx = raw.toLowerCase().indexOf(lower);
      if (idx === -1) return;
      var frag = document.createDocumentFragment();
      var cursor = 0;
      while (idx !== -1) {
        if (idx > cursor) frag.appendChild(document.createTextNode(raw.slice(cursor, idx)));
        var mark = document.createElement("mark");
        mark.textContent = raw.slice(idx, idx + q.length);
        frag.appendChild(mark);
        cursor = idx + q.length;
        idx = raw.toLowerCase().indexOf(lower, cursor);
      }
      if (cursor < raw.length) frag.appendChild(document.createTextNode(raw.slice(cursor)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  function walk(node, fn) {
    fn(node);
    (node.children || []).forEach(function (c) { walk(c, fn); });
  }

  function updateSearchMeta() {
    var wrap = document.querySelector(".search-wrap");
    var meta = document.getElementById("search-meta");
    var tree = document.getElementById("tree");
    if (!wrap) return;
    wrap.classList.toggle("has-query", !!query);
    if (!query) {
      if (meta) meta.textContent = "";
      if (tree) tree.classList.remove("empty");
      return;
    }
    var count = 0;
    walk(TREE, function (n) {
      if (nodeSearchText(n).toLowerCase().indexOf(query.toLowerCase()) !== -1) count++;
    });
    if (meta) {
      meta.textContent = count === 0 ? t("noMatches") : formatMatchCount(count);
    }
    if (tree) tree.classList.toggle("empty", count === 0);
  }

  function applySearch(q) {
    query = (q || "").trim();
    var tree = document.getElementById("tree");
    clearMarks(tree);
    document.querySelectorAll(".hidden-branch").forEach(function (el) {
      el.classList.remove("hidden-branch");
    });

    if (!query) {
      if (savedOpenBeforeSearch) {
        openSet = new Set(savedOpenBeforeSearch);
        savedOpenBeforeSearch = null;
        Object.keys(nodesById).forEach(function (id) {
          var n = nodesById[id];
          if (n.children && n.children.length) {
            var el = document.getElementById("node-" + id);
            var open = openSet.has(id);
            if (el) {
              el.classList.toggle("open", open);
              el.setAttribute("aria-expanded", open ? "true" : "false");
            }
          }
        });
      }
      updateSearchMeta();
      refreshVisible();
      return;
    }

    if (!savedOpenBeforeSearch) savedOpenBeforeSearch = Array.from(openSet);

    var matches = new Set();
    var keep = new Set();
    walk(TREE, function (n) {
      if (nodeSearchText(n).toLowerCase().indexOf(query.toLowerCase()) !== -1) {
        matches.add(n.id);
        keep.add(n.id);
        ancestorsOf(n.id).forEach(function (id) { keep.add(id); });
        // also keep descendants of a match so context remains available when a heading hits
        if (n.children) {
          (function keepKids(x) {
            (x.children || []).forEach(function (c) {
              keep.add(c.id);
              keepKids(c);
            });
          })(n);
        }
      }
    });

    Object.keys(nodesById).forEach(function (id) {
      var el = document.getElementById("node-" + id);
      if (!el) return;
      if (!keep.has(id)) el.classList.add("hidden-branch");
      else el.classList.remove("hidden-branch");
    });

    keep.forEach(function (id) {
      var n = nodesById[id];
      if (n && n.children && n.children.length && keep.has(id)) {
        // expand ancestors and matches that have children still in the keep set
        var shouldOpen = false;
        if (matches.has(id) || ancestorsNeedOpen(id, matches, keep)) shouldOpen = true;
        // Always expand kept parents so matches are visible
        var hasVisibleChild = (n.children || []).some(function (c) { return keep.has(c.id); });
        if (hasVisibleChild) shouldOpen = true;
        if (shouldOpen) setOpen(id, true, false);
      }
    });

    var langSel = lang === "en" ? ".lang-en" : ".lang-ru";
    tree.querySelectorAll(langSel).forEach(function (el) {
      var owner = el.closest(".node");
      if (owner && matches.has(owner.getAttribute("data-id"))) highlightIn(el, query);
    });

    updateSearchMeta();
    refreshVisible();
  }

  function ancestorsNeedOpen(id, matches, keep) {
    return true;
  }

  function refreshVisible() {
    visibleIds = [];
    var tree = document.getElementById("tree");
    function vis(el) {
      if (el.classList.contains("hidden-branch")) return;
      visibleIds.push(el.getAttribute("data-id"));
      if (el.classList.contains("open")) {
        var kids = el.querySelector(":scope > .children > .children-inner > ul");
        if (kids) {
          Array.from(kids.children).forEach(function (child) {
            if (child.classList.contains("node")) vis(child);
          });
        }
      }
    }
    var root = tree.querySelector(":scope > .node");
    if (root) vis(root);
  }

  function focusNode(id) {
    var tree = document.getElementById("tree");
    tree.querySelectorAll(".node").forEach(function (n) { n.tabIndex = -1; });
    var el = document.getElementById("node-" + id);
    if (el) {
      el.tabIndex = 0;
      el.focus();
    }
  }

  function onTreeClick(e) {
    if (e.target.closest("a")) return;
    var nodeEl = e.target.closest(".node");
    if (!nodeEl || !document.getElementById("tree").contains(nodeEl)) return;
    // only toggle the nearest treeitem whose row was clicked
    var row = e.target.closest(".row");
    if (!row) return;
    var owner = row.closest(".node");
    if (!owner || !owner.classList.contains("has-children")) return;
    e.preventDefault();
    toggle(owner.getAttribute("data-id"));
    focusNode(owner.getAttribute("data-id"));
    refreshVisible();
  }

  function onTreeKey(e) {
    var nodeEl = e.target.closest(".node");
    if (!nodeEl || e.target.closest("a") && (e.key === "Enter" || e.key === " ")) return;
    // if focus is on the li itself
    if (e.target !== nodeEl && e.target !== document.getElementById("tree")) {
      if (!(e.target.classList.contains("node"))) return;
    }
    if (!nodeEl.classList.contains("node")) return;
    var id = nodeEl.getAttribute("data-id");
    var idx = visibleIds.indexOf(id);
    var hasKids = nodeEl.classList.contains("has-children");

    if (e.key === "Enter" || e.key === " ") {
      if (hasKids) {
        e.preventDefault();
        toggle(id);
        refreshVisible();
      }
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      if (hasKids && !isOpen(id)) {
        setOpen(id, true);
        refreshVisible();
      } else if (hasKids && isOpen(id)) {
        var kids = nodeEl.querySelectorAll(":scope > .children .node");
        for (var i = 0; i < kids.length; i++) {
          var kidId = kids[i].getAttribute("data-id");
          if (visibleIds.indexOf(kidId) !== -1) { focusNode(kidId); break; }
        }
      }
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      if (hasKids && isOpen(id)) {
        setOpen(id, false);
        refreshVisible();
      } else {
        var parent = nodeEl.parentElement && nodeEl.parentElement.closest(".node");
        if (parent) focusNode(parent.getAttribute("data-id"));
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (idx >= 0 && idx < visibleIds.length - 1) focusNode(visibleIds[idx + 1]);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (idx > 0) focusNode(visibleIds[idx - 1]);
    } else if (e.key === "Home") {
      e.preventDefault();
      if (visibleIds.length) focusNode(visibleIds[0]);
    } else if (e.key === "End") {
      e.preventDefault();
      if (visibleIds.length) focusNode(visibleIds[visibleIds.length - 1]);
    }
  }

  function bind() {
    document.getElementById("tree").addEventListener("click", onTreeClick);
    document.getElementById("tree").addEventListener("keydown", onTreeKey);
    document.getElementById("btn-expand").addEventListener("click", function () {
      expandAll();
      refreshVisible();
    });
    document.getElementById("btn-collapse").addEventListener("click", function () {
      collapseAll();
      refreshVisible();
    });
    document.getElementById("btn-en").addEventListener("click", function () {
      lang = "en";
      saveLang();
      applyLang();
      if (query) applySearch(query);
    });
    document.getElementById("btn-ru").addEventListener("click", function () {
      lang = "ru";
      saveLang();
      applyLang();
      if (query) applySearch(query);
    });
    document.getElementById("theme-toggle").addEventListener("click", function () {
      theme = theme === "dark" ? "light" : "dark";
      saveTheme();
      applyTheme();
    });
    var search = document.getElementById("search");
    var timer = null;
    search.addEventListener("input", function () {
      var val = search.value;
      clearTimeout(timer);
      timer = setTimeout(function () { applySearch(val); }, 80);
    });
    document.getElementById("search-clear").addEventListener("click", function () {
      search.value = "";
      applySearch("");
      search.focus();
    });

    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onChange = function () {
        var stored;
        try { stored = localStorage.getItem(STORAGE.theme); } catch (e) { stored = "light"; }
        if (stored !== "light" && stored !== "dark") {
          theme = prefersDark() ? "dark" : "light";
          applyTheme();
        }
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  loadStore();
  applyTheme();
  mountTree();
  applyLang();
  bind();
})();

</script>
</body>
</html>
