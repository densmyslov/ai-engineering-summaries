<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How HiPhys-RSI learns — process workflow</title>
<meta name="color-scheme" content="light dark">
<script>

    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  try {
    var l = localStorage.getItem("behavior-2026-lang");
    if (l === "en" || l === "ru") document.documentElement.lang = l;
  } catch (e) {}
})();
</script>
<style>

:root {
  --bg: #eef1f6;
  --bg-elev: #fbfcfe;
  --bg-soft: #f3f6fb;
  --text: #16181d;
  --text-muted: #555a66;
  --border: #dce1ea;
  --border-strong: #c9d0dc;
  --accent: #3b6fd8;
  --accent-text: #1d4e89;
  --accent-soft: rgba(59, 111, 216, 0.14);
  --accent-line: rgba(59, 111, 216, 0.55);
  --shadow: 0 1px 2px rgba(20, 30, 50, 0.05), 0 10px 28px rgba(20, 30, 50, 0.08);
  --focus: #1d4ed8;
  --decision: #1d4e89;
  --outcome-build: #1f6b3a;
  --outcome-buy: #1d4e89;
  --lesson: #8a4b00;
  --limit: #6b5a4a;
  --radius: 14px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #101217;
  --bg-elev: #181b22;
  --bg-soft: #1c2433;
  --text: #eef0f6;
  --text-muted: #a8b0be;
  --border: #2c3340;
  --border-strong: #3d4656;
  --accent: #7aa2ff;
  --accent-text: #7aa2ff;
  --accent-soft: rgba(122, 162, 255, 0.16);
  --accent-line: rgba(122, 162, 255, 0.55);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.3);
  --focus: #93c5fd;
  --decision: #c5d4f5;
  --outcome-build: #7dcea0;
  --outcome-buy: #8bb4e8;
  --lesson: #f0a35e;
  --limit: #b4bcc8;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(1200px 500px at 10% -10%, var(--accent-soft), transparent 55%),
    radial-gradient(900px 400px at 100% 0%, rgba(59, 111, 216, 0.07), transparent 50%);
}

/* Nav-bar controls (moved into .aes-nav by nav.js) */
.nav-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-elev);
}
.seg button {
  font: inherit;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  padding: 0.32rem 0.6rem;
  cursor: pointer;
  min-width: 2.2rem;
  line-height: 1.2;
}
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.seg button + button { border-left: 1px solid var(--border); }
.icon-btn, .btn {
  font: inherit;
  color: var(--text);
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  cursor: pointer;
}
.icon-btn {
  width: 2rem;
  height: 2rem;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn svg { width: 1.05rem; height: 1.05rem; display: block; }
[data-theme="light"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
.seg button:focus-visible, .icon-btn:focus-visible, .step:focus-visible, a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 1.25rem 1.25rem 3.5rem;
}

.hero {
  padding: 1.4rem 0 0.4rem;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  color: var(--accent-text);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.eyebrow::before {
  content: "";
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 2px;
  background: var(--accent);
  transform: rotate(45deg);
}
h1 {
  margin: 0.35rem 0 0.3rem;
  font-size: clamp(1.6rem, 3vw, 2.15rem);
  letter-spacing: -0.03em;
  line-height: 1.2;
}
.speaker { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
.hero-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.85rem;
  margin: 0.7rem 0 0;
}
.hero-links a {
  color: var(--accent-text);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 600;
  border-bottom: 1px solid transparent;
}
.hero-links a:hover { border-bottom-color: var(--accent); }

.thesis {
  margin: 1.15rem 0 1.25rem;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1rem 1.15rem;
  font-size: 1.02rem;
}
.thesis p { margin: 0; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem 1rem;
  margin: 0 0 1.1rem;
}
.hint { margin: 0; color: var(--text-muted); font-size: 0.85rem; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.85rem;
  align-items: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 600;
}
.legend .lab { margin-right: 0.15rem; font-weight: 700; color: var(--text); }
.swatch {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}
.swatch i {
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 3px;
  border: 1px solid var(--border-strong);
  display: inline-block;
  background: var(--bg-elev);
}
.swatch.decision i { background: var(--accent-soft); border-color: var(--accent); border-radius: 1px; transform: rotate(45deg); width: 0.55rem; height: 0.55rem; }
.swatch.outcome i { background: color-mix(in srgb, var(--outcome-build) 25%, var(--bg-elev)); border-color: var(--outcome-build); }
.swatch.lesson i { background: var(--accent-soft); border-color: var(--accent); }
.swatch.limit i { background: transparent; border-style: dashed; }

/* Phases */
.phase {
  position: relative;
  margin: 0 0 1.35rem;
  padding: 1.15rem 1.1rem 1.2rem 1.15rem;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
}
.phase-head {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.95rem;
}
.phase-num {
  flex: none;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: 0.85rem;
  display: grid;
  place-items: center;
  letter-spacing: -0.02em;
}
[data-theme="dark"] .phase-num { color: #16181d; }
.phase h2 {
  margin: 0.15rem 0 0;
  font-size: 1.12rem;
  letter-spacing: -0.02em;
}
.phase-lead {
  margin: 0.15rem 0 0;
  color: var(--text-muted);
  font-size: 0.88rem;
}

/* Steps */
.flow {
  display: flex;
  align-items: flex-start;
  gap: 0;
}
.flow .step { flex: 1 1 0; min-width: 0; }
.arrow {
  flex: 0 0 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  opacity: 0.85;
  margin-top: 2.15rem;
}
.arrow svg { width: 18px; height: 18px; display: block; }
.grid-2, .grid-4 { display: grid; gap: 0.7rem; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.practices { display: flex; flex-direction: column; gap: 0.15rem; }
.practices .flow { width: 100%; }
.practices .down-arrow { display: flex; justify-content: center; color: var(--accent); opacity: 0.85; height: 1.2rem; }
.practices .down-arrow svg { width: 18px; height: 18px; transform: rotate(90deg); }

.step {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.75rem 0.8rem 0.8rem;
  position: relative;
  min-width: 0;
}
.step[data-expandable="true"] { cursor: pointer; }
.step[data-expandable="true"]:hover,
.step[data-expandable="true"]:focus-visible,
.step.is-open {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.step.decision {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  background: linear-gradient(180deg, var(--accent-soft), var(--bg-soft) 56%);
}
.step.outcome { border-color: color-mix(in srgb, var(--outcome-build) 35%, var(--border)); }
.step.outcome.buy { border-color: color-mix(in srgb, var(--outcome-buy) 40%, var(--border)); }
.step.outcome.compare { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
.step.outcome.compare .kind { color: var(--accent-text); }
.step.lesson {
  border-color: var(--accent);
  background: linear-gradient(180deg, var(--accent-soft), var(--bg-soft) 40%);
}
.step.limit { border-style: dashed; }
.kicker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  margin-bottom: 0.25rem;
}
.kind {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-text);
}
.step.outcome .kind { color: var(--outcome-build); }
.step.outcome.buy .kind { color: var(--outcome-buy); }
.step.limit .kind { color: var(--limit); }
.step h3 {
  margin: 0 0 0.28rem;
  font-size: 0.95rem;
  letter-spacing: -0.015em;
  line-height: 1.3;
}
.step .one {
  margin: 0;
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.45;
}
.more {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.28s ease;
}
.more > .more-inner { overflow: hidden; min-height: 0; }
.more-inner p {
  margin: 0.55rem 0 0;
  padding-top: 0.55rem;
  border-top: 1px solid var(--border);
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.5;
}
.step:hover .more,
.step:focus-within .more,
.step.is-open .more { grid-template-rows: 1fr; }
.chev {
  width: 1rem;
  height: 1rem;
  color: var(--text-muted);
  flex: none;
  transition: transform 0.2s ease;
}
.step[data-expandable="true"].is-open .chev,
.step[data-expandable="true"]:hover .chev,
.step[data-expandable="true"]:focus-within .chev { transform: rotate(180deg); }
.step:not([data-expandable="true"]) .chev { display: none; }

/* Decision fork */
.decision-flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.decision-flow > .step { align-self: center; width: min(100%, 28rem); }
.fork {
  display: flex;
  gap: 1rem;
  position: relative;
  margin-top: 0.15rem;
  padding-top: 0.7rem;
}
.fork::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  height: 2px;
  background: var(--accent-line);
}
.col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  position: relative;
}
.col::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 2px;
  height: 0.7rem;
  background: var(--accent-line);
  transform: translateX(-50%);
}
.edge-label {
  align-self: center;
  margin: 0.7rem 0 0.5rem;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  z-index: 1;
}
.col > .step { width: 100%; }
.nested-fork { margin-top: 0.15rem; }
.nested-fork::before { left: 25%; right: 25%; }
.col.wide { flex: 1.05; }

/* Timeline */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  padding-left: 1.15rem;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 0.35rem;
  top: 0.4rem;
  bottom: 0.4rem;
  width: 2px;
  background: var(--accent-line);
}
.tl-item {
  position: relative;
  padding: 0 0 0.7rem 0.35rem;
}
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: "";
  position: absolute;
  left: -0.95rem;
  top: 0.95rem;
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--bg-elev);
}
.tl-item.lesson::before { border-radius: 2px; }
.tl-item.limit::before {
  background: var(--bg-elev);
  border: 2px dashed var(--limit);
  box-shadow: 0 0 0 3px var(--bg-elev);
  width: 0.72rem;
  height: 0.72rem;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  margin-top: 0.7rem;
}
.metric {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.55rem 0.6rem;
  text-align: left;
}
.metric .val {
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: -0.03em;
  color: var(--accent-text);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.metric .lbl {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.7rem;
  color: var(--text-muted);
  line-height: 1.3;
}

/* Takeaways */
.takeaways {
  margin: 0 0 1.35rem;
  padding: 1.15rem 1.1rem 1.2rem;
  background: linear-gradient(180deg, var(--accent-soft), var(--bg-elev) 42%);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-radius: 18px;
  box-shadow: var(--shadow);
}
.takeaways h2 { margin: 0 0 0.8rem; font-size: 1.12rem; }
.take-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.55rem;
}
.take {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 0.75rem;
}
.take b {
  flex: none;
  width: 1.4rem;
  height: 1.4rem;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 0.75rem;
  margin-top: 0.05rem;
}
[data-theme="dark"] .take b { color: #16181d; }
.take p { margin: 0; font-size: 0.88rem; }

/* Blogs + footer */
.blogs {
  padding: 1.15rem 1.1rem 1.2rem;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 18px;
}
.blogs h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
.blogs .note { margin: 0 0 0.8rem; color: var(--text-muted); font-size: 0.82rem; }
.blogs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.65rem; }
.blogs li {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
}
.blogs a { color: var(--accent-text); font-weight: 700; text-decoration: none; }
.blogs a:hover { text-decoration: underline; }
.blogs p { margin: 0.25rem 0 0; font-size: 0.82rem; color: var(--text-muted); }
footer.source {
  margin: 1.25rem 0 0;
  color: var(--text-muted);
  font-size: 0.8rem;
}
footer.source p { margin: 0 0 0.35rem; }
footer.source a { color: var(--accent-text); }

@media (max-width: 900px) {
  .flow { flex-direction: column; }
  .arrow { flex: 0 0 1.1rem; transform: rotate(90deg); align-self: center; margin-top: 0; }
  .practices .flow { flex-direction: column; }
  .practices .flow .arrow { flex: 0 0 1.1rem; transform: rotate(90deg); align-self: center; }
  .grid-2, .metrics { grid-template-columns: 1fr 1fr; }
  .fork { flex-direction: column; padding-top: 0; gap: 0.85rem; }
  .fork::before, .col::before { display: none; }
}
@media (max-width: 620px) {
  .grid-2, .metrics, .take-list { grid-template-columns: 1fr; }
  .wrap { padding: 0.85rem 0.85rem 2.5rem; }
  .phase, .takeaways, .blogs { padding: 0.95rem 0.8rem 1rem; }
}

.edge-label {
  text-align: center;
  line-height: 1.35;
  white-space: normal;
  max-width: 16rem;
}
.loop-note {
  align-self: center;
  margin-top: 0.55rem;
  color: var(--accent-text);
  font-size: 0.75rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
  max-width: 16rem;
}
.decision-flow { margin-top: 0.35rem; }
.decision-flow > .down-arrow {
  display: flex;
  justify-content: center;
  color: var(--accent);
  opacity: 0.85;
  height: 1.25rem;
  margin: 0.35rem 0 0.15rem;
}
.decision-flow > .down-arrow svg {
  width: 18px;
  height: 18px;
  transform: rotate(90deg);
}
.metrics { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) {
  .metrics { grid-template-columns: 1fr 1fr; }
  .edge-label, .loop-note { max-width: none; }
}
@media (max-width: 620px) {
  .metrics { grid-template-columns: 1fr; }
}

</style>
<script src="../nav.js"></script>
</head>

<main class="wrap">
  <header class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>

  <div class="toolbar">

    "p3s3d": "Для новой задачи агент сравнивает ситуацию с карточками и выбирает один пайплайн или одну VLA. Выбранный компонент затем выполняется сам.",
    "p3s3m": "Карточки обновляются новыми результатами с обучающих сцен, так что более поздние решения о маршрутизации могут учитывать накопленный опыт. Гибридная система из статьи — это этот слой маршрутизации плюс построенные пайплайны.",
    "p3s4t": "Дообучить VLA по прогонам",
    "p3s4d": "Прогоны пайплайнов превращаются в последовательности «наблюдение–действие» и смешиваются с официальными демонстрациями для дообучения VLA. Это единственное место в методе, где обновляются веса модели.",
    "p3s4m": "Авторы взяли прошлогоднюю победившую модель на основе π0.5 и обучили три варианта: одну эпоху по всем 100 задачам, две эпохи и дообучение на каждую задачу, включающее эти траектории агента и дополнительные трёхмерные входы, например глубину. Полученные политики стоят рядом с пайплайнами как кандидаты для маршрутизации.",
    "p4": "Что цикл обычно находит",
    "p4lead": "Оценки сначала растут быстро, затем выходят на плато. Дальнейший прирост даёт поиск новых стратегий, а несколько трудных задач требуют гораздо больше работы.",
    "p4s1t": "Ранние итерации: собрать уже имеющееся",
    "p4s1d": "Быстрый прирост даёт исправление настроек инструментов, порядка выполнения и координации — простых сбоев внутри в целом подходящей стратегии.",
    "p4s2t": "Поздние итерации: придумать новую стратегию",
    "p4s2d": "После этого дальнейший прирост появляется, когда агент находит более устойчивый способ выполнить задачу, часто такой, которого не было в демонстрациях.",
    "p4s2m": "Примеры: взять сковороду за ближний край, когда ручка недоступна; опрокинуть распылитель на бок перед захватом; сначала поставить пустые пакеты в коробку, а затем бросить в них бургеры; поднять тачку за передний край кузова, когда ручки загорожены.",
    "p4s3t": "Большинство задач дёшевы, некоторые — нет",
    "p4s3d": "Медианная задача заняла около 25.5 итераций, но у распределения длинный хвост: небольшой набор задач потребовал гораздо больше правок.",
    "p4s3m": "Обычная расстановка предметов и работа с инструментом в среднем требовали больше всего работы. Точные манипуляции имели низкую медиану, но длинный верхний хвост. Авторы предлагают выделять трудным задачам больший бюджет итераций, а не одинаковый для всех.",
    "p4s4t": "Общие навыки и редкие",
    "p4s4d": "Навигация, визуальный поиск, захват и установка встречаются почти в каждом пайплайне. Более редкие навыки — разрезание, наливание, работа с шарнирами и устройствами — часто решают, выполнима ли задача вообще.",
    "p4s5t": "Цифры из отчёта",
    "p4s5d": "Эти числа взяты из текста и рисунков статьи. В отчёте нет одной итоговой оценки на все задачи.",
    "p4s6t": "Гибридная система обошла чисто VLA-базовые линии",
    "p4s6d": "Она набрала больше, чем любой чисто VLA-вариант, почти на всех задачах, во всех восьми категориях.",
    "p4s6m": "Вторая эпоха многозадачного обучения VLA почти не помогла. Дообучение на каждую задачу, в том числе на данных пайплайнов, подняло оценки, но слабые места VLA остались теми же: поиск и доставка предметов по дому, установка по соответствию и точное выравнивание.",
    "p4s7t": "Физические ограничения остаются",
    "p4s7d": "Захват по-прежнему главный тип сбоя. Ошибки установки и работы с шарнирами стали реже, а тайм-ауты и сбои навигации — чаще: робот часто тратит бюджет на поиск или не может пройти в узкий зазор.",
    "m1v": "100",
    "m1l": "домашних задач",
    "m2v": "10",
    "m2l": "обучающих сцен на задачу",
    "m3v": "25.5",
    "m3l": "медиана числа итераций правки",
    "m4v": "0.02 за 10",
    "m4l": "правило остановки по умолчанию (прирост, затем терпение)",
    "m5v": "Обычно < 0.2",
    "m5l": "типичное снижение на скрытом тесте",
    "m6v": "32.7%",
    "m6l": "сбоев по-прежнему из‑за захвата",
    "p5": "Когда оценка — это ещё не задача",
    "p5lead": "Поскольку агент оптимизирует официальный оценщик, более высокий балл считается успешной правкой даже тогда, когда поведение не соответствует замыслу задачи.",
    "p5s1t": "Награда — это оценщик",
    "p5s1d": "Агент оптимизирует официальную оценку, а не человеческое представление о законченной работе.",
    "p5s2t": "Явный обходной путь",
    "p5s2d": "В задаче на укладку дров агент сложил три отдельные пары соприкасающихся брёвен вместо одной поленницы. Это удовлетворяет правилу, что каждое бревно касается другого, но обходит задуманную стопку.",
    "p5s3t": "Более двусмысленный случай",
    "p5s3d": "В задаче на консервирование агент нарезал еду прямо в холодильнике, получил частичный балл и так и не переложил еду в миску. Это может быть законным промежуточным шагом — или погоней за лёгкими очками.",
    "p5s3m": "Авторы рассматривают это как знакомую проблему проектирования награды: косвенный критерий, который работает при обычном поведении, может сломаться, когда система усердно ищет высокий балл. Они предлагают в будущих бенчмарках также проверять, может ли робот сам понять, что задача закончена.",
    "p5s4t": "Скрытый тест и другие оговорки",
    "p5s4d": "На скрытом тесте оценки большинства задач были немного ниже, обычно менее чем на 0.2, с наибольшим падением на задачах с поиском. На каждую задачу пришлось только 10 тестовых сцен; при построении допускались человеческие правки; все результаты — в симуляции.",
    "takeaways": "Главные выводы",
    "t1": "«Обучение» — это правка программы под оценку за задачу. Веса модели не меняются.",
    "t2": "Растёт повторно используемое структурированное знание: код, ограничения и заметки о том, что не получается.",
    "t3": "Эти программы могут также давать данные для обучения VLA, так что масштабирование через структуру питает масштабирование через данные.",
    "t4": "Поскольку цель — официальная оценка, агент может поднять число обходным путём, который не является задуманной задачей.",
    "t5": "Многие проблемы координации решаются в коде; оставшиеся узкие места физические — захват, поиск спрятанных предметов и нехватка времени.",
    "source": "Эта схема составлена по чемпионскому техническому отчёту Huawei Noah для BEHAVIOR Challenge 2026. В отчёте нет исходного кода ни одного пайплайна.",
    "footerPdf": "Технический отчёт (PDF)",
    "footerSummary": "Текстовое резюме",
    "kindStep": "Шаг",
    "kindDecision": "Решение",
    "kindOutcome": "Итог",
    "kindLesson": "Урок",
    "kindLimit": "Ограничение"
  }
};

  var ARROW = '<span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M5.2 7.2a1 1 0 0 1 1.4 0L10 10.6l3.4-3.4a1 1 0 1 1 1.4 1.4l-4.1 4.1a1 1 0 0 1-1.4 0L5.2 8.6a1 1 0 0 1 0-1.4z"/></svg>';

  var FROZEN = ["p1s1", "p1s2", "p1s3", "p1s4"];
  var LOOP = ["p2s1", "p2s2", "p2s3", "p2s4"];
  var FINDS = [
    { key: "p4s1", cls: "" },
    { key: "p4s2", cls: "" },
    { key: "p4s3", cls: "" },
    { key: "p4s4", cls: "" },
    { key: "p4s5", cls: "outcome", metrics: true },
    { key: "p4s6", cls: "lesson" },
    { key: "p4s7", cls: "limit" }
  ];
  var SCORE = [
    { key: "p5s1", cls: "" },
    { key: "p5s2", cls: "limit" },
    { key: "p5s3", cls: "limit" },
    { key: "p5s4", cls: "limit" }
  ];

  var lang = document.documentElement.lang === "ru" ? "ru" : "en";
  var theme = document.documentElement.getAttribute("data-theme") || "light";

  function pack() { return I18N[lang] || I18N.en; }
  function t(key) { return pack()[key] || I18N.en[key] || ""; }

  function kindLabel(el) {
    if (el.classList.contains("decision")) return t("kindDecision");
    if (el.classList.contains("lesson")) return t("kindLesson");
    if (el.classList.contains("limit")) return t("kindLimit");
    if (el.classList.contains("outcome")) return t("kindOutcome");
    return t("kindStep");
  }

  function metricsHtml() {
    var ids = [1, 2, 3, 4, 5, 6];
    return '<div class="metrics">' + ids.map(function (i) {
      return '<div class="metric"><span class="val" data-i18n="m' + i + 'v"></span><span class="lbl" data-i18n="m' + i + 'l"></span></div>';
    }).join("") + "</div>";
  }

  function fillStep(el, key) {
    var more = t(key + "m");
    var expandable = !!more;
    if (expandable) el.setAttribute("data-expandable", "true");
    else el.removeAttribute("data-expandable");
    if (expandable) {
      el.setAttribute("tabindex", "0");
      el.setAttribute("role", "button");
      el.setAttribute("aria-expanded", el.classList.contains("is-open") ? "true" : "false");
    } else {
      el.removeAttribute("tabindex");
      el.removeAttribute("role");
      el.removeAttribute("aria-expanded");
    }
    var html = '<div class="kicker"><span class="kind">' + kindLabel(el) + "</span>";
    if (expandable) html += CHEV;
    html += "</div>";
    html += "<h3 data-i18n=\"" + key + "t\"></h3>";
    html += "<p class=\"one\" data-i18n=\"" + key + "d\"></p>";
    if (el.hasAttribute("data-metrics")) html += metricsHtml();
    if (expandable) {
      html += '<div class="more"><div class="more-inner"><p data-i18n="' + key + 'm"></p></div></div>';
    }
    el.innerHTML = html;
  }

  function makeStep(key, extraClass) {
    var el = document.createElement("article");
    el.className = "step" + (extraClass ? " " + extraClass : "");
    el.setAttribute("data-key", key);
    return el;
  }

  function buildFlow(container, keys) {
    container.innerHTML = "";
    keys.forEach(function (key, i) {
      if (i) container.insertAdjacentHTML("beforeend", ARROW);
      container.appendChild(makeStep(key));
    });
  }

  function buildCase(container, items) {
    container.innerHTML = "";
    items.forEach(function (item) {
      var wrap = document.createElement("div");
      wrap.className = "tl-item" + (item.cls ? " " + item.cls : "");
      var step = makeStep(item.key, item.cls);
      if (item.metrics) step.setAttribute("data-metrics", "true");
      wrap.appendChild(step);
      container.appendChild(wrap);
    });
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("pageTitle");
    document.querySelectorAll(".step[data-key]").forEach(function (el) {
      fillStep(el, el.getAttribute("data-key"));
    });
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    var en = document.getElementById("btn-en");
    var ru = document.getElementById("btn-ru");
    en.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    ru.setAttribute("aria-pressed", lang === "ru" ? "true" : "false");
    en.setAttribute("aria-label", t("langToEn"));
    ru.setAttribute("aria-label", t("langToRu"));
    applyTheme();
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("theme-toggle");
    var label = theme === "dark" ? t("themeToLight") : t("themeToDark");
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  }

  function saveLang() { try { localStorage.setItem("behavior-2026-lang", lang); } catch (e) {} }
  function saveTheme() { try { localStorage.setItem("behavior-2026-theme", theme); } catch (e) {} }

  function toggleStep(el) {
    if (!el || el.getAttribute("data-expandable") !== "true") return;
    var open = !el.classList.contains("is-open");
    el.classList.toggle("is-open", open);
    el.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function bind() {
    document.getElementById("btn-en").addEventListener("click", function () {
      lang = "en"; saveLang(); applyI18n();
    });
    document.getElementById("btn-ru").addEventListener("click", function () {
      lang = "ru"; saveLang(); applyI18n();
    });
    document.getElementById("theme-toggle").addEventListener("click", function () {
      theme = theme === "dark" ? "light" : "dark";
      saveTheme();
      applyTheme();
    });
    document.addEventListener("click", function (e) {
      var step = e.target.closest(".step[data-expandable='true']");
      if (step) toggleStep(step);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var step = e.target.closest && e.target.closest(".step[data-expandable='true']");
      if (!step || e.target !== step) return;
      e.preventDefault();
      toggleStep(step);
    });
  }

  function buildReuse(container) {
    container.innerHTML = "";
    var top = document.createElement("div");
    top.className = "grid-2";
    top.appendChild(makeStep("p3s1"));
    top.appendChild(makeStep("p3s4"));
    container.appendChild(top);
    container.insertAdjacentHTML("beforeend", '<div class="down-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>');
    var bottom = document.createElement("div");
    bottom.className = "flow";
    bottom.appendChild(makeStep("p3s2"));
    bottom.insertAdjacentHTML("beforeend", ARROW);
    bottom.appendChild(makeStep("p3s3"));
    container.appendChild(bottom);
  }

  buildFlow(document.getElementById("flow-frozen"), FROZEN);
  buildFlow(document.getElementById("flow-loop"), LOOP);
  buildReuse(document.getElementById("flow-reuse"));
  buildCase(document.getElementById("flow-finds"), FINDS);
  buildCase(document.getElementById("flow-score"), SCORE);
  applyI18n();
  bind();
})();
</script>
</body>
</html>
